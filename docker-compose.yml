# NAS FeedOps Sentinel — full observability stack
# Brings up the agent + Prometheus + Grafana for a complete NOC-style demo.

services:
  sentinel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: nas-feedops-sentinel:latest
    container_name: nas-sentinel
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CRITIC_ENABLED=${CRITIC_ENABLED:-1}
      - CRITIC_MODEL=${CRITIC_MODEL:-claude-haiku-4-5-20251001}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - NIM_ENDPOINT=${NIM_ENDPOINT:-}
      - NIM_MODEL=${NIM_MODEL:-meta/llama3-8b-instruct}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "9108:9108"   # Prometheus /metrics
    volumes:
      - sentinel-data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: nas-feedops-sentinel:latest
    container_name: nas-dashboard
    restart: unless-stopped
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.headless=true
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CRITIC_ENABLED=${CRITIC_ENABLED:-1}
    ports:
      - "8501:8501"
    volumes:
      - sentinel-data:/app/data

  prometheus:
    image: prom/prometheus:latest
    container_name: nas-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    depends_on:
      - sentinel

  grafana:
    image: grafana/grafana:latest
    container_name: nas-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  sentinel-data:
  prometheus-data:
  grafana-data:
