// A dismissed overview tooltip opens again on the next hover, once the pointer has left its (i) and tooltip.
document.addEventListener('mouseout', (e) => {
  const about = e.target.closest?.('#overview .about.dismissed')
  if (about && !about.contains(e.relatedTarget)) about.classList.remove('dismissed')
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeTips()
    return closeDrawer()
  }
  // Only when the card or graph row itself has focus; Enter on the Approve button inside a card is that button's own click.
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-job], .g-row[data-job]')) {
    e.preventDefault() // Space would otherwise scroll the page
    openDrawer(e.target.dataset.job)
  }
})

// ---- Compliance matrix ----------------------------------------------------

// The one list of compliance gates, in display order; the drawer's matrix and the executive briefing both read it.
// kind says where a row's status comes from: review:<key> is that reviewer's verdict (keys as in REVIEWERS), decision
// and escalation come from decision.md, and placeholder is a check the factory has not built: always "not run".
const COMPLIANCE_ROWS = [
  { group: 'Security and Static Analysis', rows: [
    { id: 'sast', gate: 'SAST scan', check: 'Code scanned for security flaws', kind: 'placeholder' },
    { id: 'dast', gate: 'DAST scan', check: 'Running app probed for flaws', kind: 'placeholder' },
    { id: 'dependencies', gate: 'Dependency vulnerability check', check: 'Known flaws in dependencies', kind: 'placeholder' },
    { id: 'credentials', gate: 'Credential leak prevention (Vault integration status)',
      check: 'Secrets kept out of code, in Vault', kind: 'placeholder' },
    { id: 'security-review', gate: 'Security review', check: 'Verdict in review-security.md', kind: 'review:security' },
  ] },
  { group: 'IP and Licensing Guardrails', rows: [
    { id: 'license', gate: 'License compatibility', check: 'Dependency licenses allow this use', kind: 'placeholder' },
    { id: 'copyleft', gate: 'No copyleft (GPL) contamination', check: 'No copyleft-licensed code', kind: 'placeholder' },
  ] },
  { group: 'Regulatory and Policy Alignment', rows: [
    { id: 'iso27001', gate: 'ISO 27001', check: 'Information security controls', kind: 'placeholder' },
    { id: 'soc2', gate: 'SOC 2', check: 'Trust services criteria', kind: 'placeholder' },
    { id: 'fedramp', gate: 'FedRAMP tags', check: 'US federal cloud control tags', kind: 'placeholder' },
  ] },
  { group: 'Factory reviews and decision', rows: [
    { id: 'ux-review', gate: 'UX review', check: 'Verdict in review-ux.md', kind: 'review:ux' },
    { id: 'ui-review', gate: 'UI review', check: 'Verdict in review-ui.md', kind: 'review:ui' },
    { id: 'code-review', gate: 'Code review', check: 'Verdict in review-code.md', kind: 'review:code' },
    { id: 'decision', gate: 'Approver decision', check: 'Line 1 of decision.md', kind: 'decision' },
    { id: 'escalation', gate: 'Escalation reason', check: 'Why section of decision.md', kind: 'escalation' },
  ] },
]
const WHY_CHARS = 300

// The first paragraph under "## Why" in a decision.md, on one line; null when there is none.
function whyOf(text) {
  const lines = text.replace(/\r/g, '').split('\n')
  const at = lines.findIndex((l) => /^##\s+Why\s*$/.test(l))
  const para = []
  for (const l of at < 0 ? [] : lines.slice(at + 1)) {
    if (!l.trim()) {
      if (para.length) break
      continue
    }
    if (l.startsWith('#')) break
    para.push(l.trim())
  }
  return para.length ? para.join(' ') : null
}

// One job's matrix as rows { id, group, gate, check, status, evidence }, in COMPLIANCE_ROWS order. files are the
// paths listFiles(base) gives, firstLines the drawer's cache (keyed base + path; a listed file with no entry could not
// be read), and decision the text of decision.md when its line 1 is ESCALATE, or null. Status is only ever passed,
// failed or not run. It touches no DOM and fetches nothing, so the executive briefing can reuse it.
function complianceRows(base, files, firstLines, decision) {
  const line = (f) => firstLines.get(base + f)
  const reviews = files
    .map((f) => f.match(/^round-(\d+)\/review-(\w+)\.md$/))
    .filter((m) => m && REVIEWERS.some(([k]) => k === m[2]))
    .map(([f, n, key]) => ({ f, n: Number(n), key }))
    .sort((a, b) => a.n - b.n)
  // The latest round is the highest with any review file; a reviewer with no file in it has not run yet.
  const latest = Math.max(0, ...reviews.map((r) => r.n))
  const verdict = (f) => {
    if (line(f) === undefined) return ['not run', `could not read ${f}`]
    const v = verdictOf(line(f))
    return v === 'PASS' ? ['passed'] : v === 'CHANGES' ? ['failed'] : ['not run', 'verdict line not valid']
  }
  // Status of the latest round, then every round this reviewer has a file for, oldest first: "R1 failed, R2 passed".
  const review = (key) => {
    const mine = reviews.filter((r) => r.key === key)
    const now = mine.find((r) => r.n === latest)
    const [status, note] = now ? verdict(now.f) : ['not run', 'no verdict yet']
    const shown = latest ? `round ${latest}${note ? `: ${note}` : ''}` : note
    const history = mine.map((r) => `R${r.n} ${verdict(r.f)[0]}`).join(', ')
    return [status, history ? `${shown} · ${history}` : shown]
  }
  // null: there is no decision.md; undefined: it is listed but could not be read.
  const first = files.includes('decision.md') ? line('decision.md') : null
  const decided = () => {
    if (first === null) return ['not run', 'no decision yet']
    if (first === undefined) return ['not run', 'could not read decision.md']
    if (first === 'APPROVE') return ['passed', 'decision.md line 1: APPROVE']
    if (first === 'ESCALATE') return ['failed', 'decision.md line 1: ESCALATE, sent to a human']
    return ['not run', 'decision line not valid']
  }
  const escalation = () => {
    if (first === 'APPROVE') return ['not run', 'no escalation']
    if (first !== 'ESCALATE') return decided()
    if (decision === null) return ['not run', 'could not read decision.md']
    const why = whyOf(decision)
    if (why === null) return ['failed', 'no Why section in decision.md']
    return ['failed', why.length > WHY_CHARS ? `${why.slice(0, WHY_CHARS).replace(/\s+\S*$/, '')}…` : why]
  }
  const statusOf = (kind) => {
    if (kind === 'placeholder') return ['not run', 'check not built in the factory']
    if (kind === 'decision') return decided()
    if (kind === 'escalation') return escalation()
    return review(kind.replace(/^review:/, ''))
  }
  return COMPLIANCE_ROWS.flatMap(({ group, rows }) => rows.map(({ id, gate, check, kind }) => {
    const [status, evidence] = statusOf(kind)
    return { id, group, gate, check, status, evidence }
  }))
}

// The drawer's table, built from complianceRows() alone: one body per group, headed by the group's name.
function complianceTable(rows) {
  const groups = [...new Set(rows.map((r) => r.group))]
  const body = groups.map((g) => `<tbody><tr><th colspan="4" scope="rowgroup">${esc(g)}</th></tr>` +
    rows.filter((r) => r.group === g).map((r) => `<tr class="${esc(r.status.replace(' ', '-'))}">` +
      `<td>${esc(r.gate)}</td><td>${esc(r.check)}</td><td class="st">${esc(r.status)}</td><td>${esc(r.evidence)}</td></tr>`)
      .join('') + '</tbody>').join('')
  return '<div class="m-title" id="d-matrix-title">Compliance matrix</div>' +
    '<table id="d-matrix" aria-labelledby="d-matrix-title"><thead><tr>' +
    `<th>Gate</th><th>Check</th><th>Status</th><th>Evidence</th></tr></thead>${body}</table>`
}

let matrixHtml = null

// Runs at the end of every refreshDrawer(). Only an ESCALATE decision needs decision.md's text, for its Why: the open
// file's text when decision.md is open, else one fetch, which leaves it null when it fails ("could not read").
// The table is replaced only when it changed, so its scroll position survives the poll.
async function refreshMatrix(base, files, openDecision) {
  let decision = null
  if (files.includes('decision.md') && firstLines.get(base + 'decision.md') === 'ESCALATE') {
    decision = openDecision !== null ? openDecision : await fetchText(base + 'decision.md').catch(() => null)
  }
  const html = complianceTable(complianceRows(base, files, firstLines, decision))
  if (html !== matrixHtml) {
    matrixHtml = html
    $('d-compliance').innerHTML = html
  }
}

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n')
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) { html += `<div class="verdict ${t}">${esc(first)}</div>`; i = 1 }

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${inline(body.join(' '))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

poll()
setInterval(poll, POLL_MS)
</script>
</body>
</html>
