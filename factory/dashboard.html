// ---- Live stream view ------------------------------------------------------------

// The newest stage changes across all jobs, newest first, from each job's readable stage_log. A job whose log cannot
// be read is counted, not guessed at: no time is invented for it.
function activity() {
  const rows = []
  let missing = 0
  for (const job of jobs) {
    const { log } = stageLog(job)
    if (!log) {
      missing++
      continue
    }
    for (const e of log) rows.push({ id: job.id, at: e.at, t: e.t, stage: e.stage })
  }
  // Equal times keep the higher job id first, so the order never depends on the folder listing.
  rows.sort((a, b) => b.t - a.t || (a.id < b.id ? 1 : a.id > b.id ? -1 : 0))
  return { rows: rows.slice(0, ACTIVITY_ROWS), missing }
}

const utcText = (ms) => new Date(ms).toISOString().replace(/\.\d{3}Z$/, 'Z')

function streamView(problems) {
  const { rows, missing } = activity()
  const facts = [
    ['Source', `jobs/ (this folder, read every ${POLL_MS / 1000} seconds)`],
    ['Last update', lastOk === null ? '-' : utcText(lastOk)],
    ['Jobs read', String(jobs.length)],
    ['Running now', String(activeJobs())],
    ['Price list', pricesError === null ? 'read' : `could not be read: ${pricesError}`],
  ].map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('') +
    `<div><dt>Problems</dt><dd>${problems.length}` +
    (problems.length ? `<ul>${problems.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : '') + '</dd></div>'
  const table = rows.length
    ? '<table id="stream-activity"><thead><tr><th>Time (UTC)</th><th>Job</th><th>Stage entered</th></tr></thead><tbody>' +
      rows.map((r) => `<tr><td>${esc(r.at)}</td>` +
        `<td><button class="job-btn" type="button" data-job="${esc(r.id)}">${esc(r.id)}</button></td>` +
        `<td>${esc(r.stage)}</td></tr>`).join('') + '</tbody></table>'
    : '<div class="empty">—</div>'
  const left = missing
    ? `<div class="stream-left">${esc(`${missing} ${missing === 1 ? 'job has' : 'jobs have'} no readable stage log and ` +
      `${missing === 1 ? 'is' : 'are'} not listed`)}</div>`
    : ''
  return '<div class="stream-wrap"><h2>Live Stream</h2>' +
    `<div class="s-status ${STREAM[streamState].cls}">${esc(streamStatus())}</div>` +
    `<dl class="facts">${facts}</dl><h3>Recent activity</h3>${table}${left}</div>`
}

// ---- Board cards -----------------------------------------------------------------

// Rework is read from the job folder: /factory rework is the only thing that writes rework-<k>.md, so one or more
// means the owner sent the job back. Limit: once such a file exists, the page cannot tell a later reviewer-requested
// fix from an owner rework, so the job shows in Rework for any later time in build.
// Returns { count, error }; count is 0 for a job that needs no lookup or whose listing could not be read.
async function reworkOf(job) {
  if (job.stage !== 'build' && !(Number.isInteger(job.round) && job.round >= 1)) return { count: 0, error: null }
  if (reworkCache.has(job.id)) return { count: reworkCache.get(job.id), error: null }
  try {
    const count = (await listLinks(`jobs/${job.id}/`)).filter((h) => /^rework-\d+\.md$/.test(h)).length
    if (job.stage === 'merged') reworkCache.set(job.id, count)
    return { count, error: null }
  } catch (err) {
    return { count: 0, error: err.message }
  }
}

function card(job, past, cost, rework) {
  const live = LIVE.has(job.stage)
  const human = job.stage === 'needs-human'
  const rows = past.map((v, i) => chips(i + 1, v, false))
  if (job.round > 0) rows.push(chips(job.round, job.reviews, job.stage === 'review'))
  const [num, ...slug] = job.id.split('-')
  // A div, not a button, so the Approve button can sit inside it; the keydown listener gives it Enter and Space.
  return `
    <div class="card ${live ? 'live' : ''} ${human ? 'human' : ''} ${job.stage === 'merged' ? 'merged' : ''}"
         role="button" tabindex="0" data-job="${esc(job.id)}">
      <div class="card-top">
        ${live ? '<span class="pulse" aria-label="running"></span>' : ''}
        <span class="num">${esc(num)} · ${esc(slug.join('-'))}</span>
        ${human ? '<span class="flag">your call</span>' : ''}
      </div>
      <p class="feature">${esc(job.feature)}</p>
      <div class="branch">${esc(job.branch)}</div>
      ${figures(job, cost, rework)}
      ${rows.length ? `<div class="rounds">${rows.join('')}</div>` : ''}
      ${human ? `<div class="hint">/factory approve ${esc(job.id)}<br>/factory rework ${esc(job.id)} …</div>
      <div class="approve">
        <button type="button" data-approve="${esc(job.id)}">Approve</button>
        <span class="approve-msg" role="status">${APPROVE_BEFORE}</span>
      </div>` : ''}
    </div>`
}

// The page only reads job files, so Approve cannot merge: it copies the command for a factory session.
const APPROVE_BEFORE = 'Copies the approve command. Paste it into a factory session; this page cannot merge.'

async function copyApprove(el) {
  const msg = el.parentElement.querySelector('.approve-msg')
  try {
    // navigator.clipboard is undefined outside a secure context; reading writeText off it throws into the catch.
    await navigator.clipboard.writeText(`/factory approve ${el.dataset.approve}`)
    msg.textContent = 'Copied. Paste into a factory session to approve.'
  } catch {
    msg.textContent = 'Could not copy. Select the /factory approve line above and copy it by hand.'
  }
}

// ---- Views -----------------------------------------------------------------------

// The four views live in one page and the URL hash chooses between them, so each has its own address and the browser's
// Back button steps through them. An empty or unknown hash is the board.
const VIEWS = ['board', 'git', 'cost', 'stream']

function showView() {
  const name = decodeURIComponent(location.hash.replace(/^#/, ''))
  const now = VIEWS.includes(name) ? name : 'board'
  for (const v of VIEWS) $(`view-${v}`).hidden = v !== now
  for (const a of $('view-toggle').querySelectorAll('a')) {
    const on = a.getAttribute('href') === `#${now}`
    a.classList.toggle('on', on)
    if (on) a.setAttribute('aria-current', 'page')
    else a.removeAttribute('aria-current')
  }
}

async function render() {
  const problems = pricesError ? [`Could not read prices.json (${pricesError}), so every full price shows unknown`] : []
  problems.push(...engagementProblems)
  const byStage = Object.fromEntries(STAGES.map((s) => [s.key, []]))
  const pasts = await Promise.all(jobs.map(pastRounds))
  const reworks = await Promise.all(jobs.map(reworkOf))
  jobs.forEach((job, i) => {
    const cost = costOf(job)
    problems.push(...jobProblems(job, cost))
    const r = reworks[i]
    if (r.error) problems.push(`Could not read the folder of job ${job.id} (${r.error}), so it is counted as not sent back`)
    const col = job.stage === 'build' && r.count > 0
      ? 'rework'
      : (STAGES.find((s) => s.stages.includes(job.stage)) || {}).key
    if (!col) problems.push(`Job ${job.id} has unknown stage "${job.stage}"`)
    else byStage[col].push(card(job, pasts[i], cost, col === 'rework' ? r.count : 0))
  })
  // Newest first within a column.
  const board = STAGES.map((s) => `
    <section class="col" data-col="${s.key}">
      <div class="col-head">
        <div class="col-top"><h2 class="col-title">${esc(s.label)}</h2><span class="col-badge">${byStage[s.key].length}</span></div>
        <span class="who">${esc(s.who)}</span>
      </div>
      ${byStage[s.key].reverse().join('') || '<div class="empty">—</div>'}
    </section>`).join('')
  // Worked out once and shared, so the cards and the Cost & LOE view can never disagree.
  const figs = overviewFigures(pasts)
  renderBand()
  put('banner', problems.map((p) => `<div class="banner">${esc(p)}</div>`).join(''))
  put('kpi-cards', kpiCards(figs))
  put('view-board', board)
  put('view-git', gitView())
  put('view-cost', costView(figs))
  put('view-stream', streamView(problems))
}

async function poll() {
  try {
    jobs = await loadJobs()
    await loadPrices()
    await loadEngagement()
    if (openJobId) await refreshDrawer()
    streamState = 'active'
    streamError = null
    lastOk = Date.now()
  } catch (err) {
    // The last good data stays on screen; the pill, the Live Stream view and Last update say the read failed.
    streamState = 'error'
    streamError = err.message
  }
  await render()
}

// Each orchestrator session writes only its own jobs/<id>/job.json.
async function loadJobs() {
  const doc = new DOMParser().parseFromString(await fetchText('jobs/'), 'text/html')
  const ids = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/'))
    .map((h) => h.slice(0, -1))
    .sort()
  return Promise.all(ids.map(async (id) => JSON.parse(await fetchText(`jobs/${id}/job.json`))))
}

// A missing or broken prices.json makes full prices unknown and says why in a banner; the board still renders.
async function loadPrices() {
  try {
    const p = JSON.parse(await fetchText('prices.json'))
    if (!p || typeof p.usd_per_mtok !== 'object' || p.usd_per_mtok === null) throw new Error('no usd_per_mtok')
    prices = p
    pricesError = null
  } catch (err) {
    prices = null
    pricesError = err.message
  }
}

// engagement.json, beside prices.json, is optional and written only by the owner; the factory never creates it:
//   { "client": "<text>", "stage": "<text>", "sprint": <whole number>, "monthly_budget_usd": <number >= 0>,
//     "traditional_usd_per_point": <your rate, a number > 0> }
// traditional_usd_per_point is the owner's all-in cost to have a traditional developer deliver one story point; AI
// cost efficiency compares it, times a job's points, with the job's list price. It is the owner's own figure and the
// page never supplies one, so until it is set every AI cost efficiency figure shows "-".
// Every key is optional. A missing file, a missing key or null shows "-": no value is ever defaulted. A file that is
// not valid JSON, or a key of the wrong type, shows "-" for what it cannot read and says so in a banner.
// The folder index is read first so a missing file is not fetched, which would log a 404 on every poll.
const ENGAGEMENT_KEYS = {
  client: [(v) => typeof v === 'string', 'text'],
  stage: [(v) => typeof v === 'string', 'text'],
  sprint: [(v) => Number.isInteger(v) && v >= 0, 'a whole number'],
  monthly_budget_usd: [(v) => Number.isFinite(v) && v >= 0, 'an amount in dollars'],
  traditional_usd_per_point: [(v) => Number.isFinite(v) && v > 0, 'an amount in dollars above zero'],
}

async function loadEngagement() {
  engagement = {}
  engagementProblems = []
  if (!(await listLinks('./')).includes('engagement.json')) return
  let e
  try {
    e = JSON.parse(await fetchText('engagement.json'))
  } catch (err) {
    engagementProblems.push(`Could not read engagement.json (${err.message}), so client, stage, sprint, budget and AI cost efficiency show -`)
    return
  }
  if (e === null || typeof e !== 'object' || Array.isArray(e)) {
    engagementProblems.push('engagement.json is not a JSON object, so client, stage, sprint, budget and AI cost efficiency show -')
    return
  }
  for (const [k, [ok, kind]] of Object.entries(ENGAGEMENT_KEYS)) {
    if (!isSet(e[k])) continue
    if (ok(e[k])) engagement[k] = e[k]
    else engagementProblems.push(`engagement.json has ${k} ${JSON.stringify(e[k])}, not ${kind}, so it shows -`)
  }
}

// ---- Drawer --------------------------------------------------------------

// python -m http.server serves an HTML index for directories; read its links.
async function listFiles(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  const hrefs = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
  const out = []
  for (const h of hrefs) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

function fileRank(path) {
  const order = ['spec.md', 'build.md', 'decision.md']
  if (order.includes(path)) return [0, order.indexOf(path), path]
  const round = path.match(/^round-(\d+)\/review-(\w+)\.md$/)
  if (round) return [2, Number(round[1]) * 10 + REVIEWERS.findIndex(([k]) => k === round[2]), path]
  return [1, 0, path] // rework-<k>.md and anything else
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|APPROVE|STATUS:\s*READY)$/.test(first)) return 'good'
  if (/^VERDICT:\s*CHANGES$/.test(first)) return 'warn'
  if (/^(ESCALATE|STATUS:\s*BLOCKED)$/.test(first)) return 'stop'
  return null
}

const firstLines = new Map()

// One row per round from the usage log (round 0 is the spec), then the job's total.
function costTable(cost) {
  if (!cost.recorded) return '<p class="note">No usage recorded for this job.</p>'
  const cell = (v, fmt) => (v === null ? '-' : fmt(v))
  const row = (label, s) => `<tr><td>${esc(label)}</td><td>${cell(s.tokens, tokensText)}</td>` +
    `<td>${cell(s.seconds, duration)}</td><td>${loeText(s)}</td><td>${esc(priceText(cost, s.usd))}</td></tr>`
  return '<table><tr><th>Round</th><th>Tokens</th><th>Time</th><th>LOE</th><th>Full price</th></tr>' +
    cost.rounds.map(([n, s]) => row(n === 0 ? '0 (spec)' : String(n), s)).join('') +
    row('Total', cost.total) + '</table>'
}

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job) return
  $('d-num').textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''}`
  $('d-title').textContent = job.feature
  $('d-branch').textContent = job.branch
  const cost = costOf(job)
  $('d-cost').innerHTML = costTable(cost) + moneyLines(job, cost)

  const base = `jobs/${job.id}/`
  const files = sortFiles(await listFiles(base))
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null

  let text = null
  if (openPath) {
    text = await fetchText(base + openPath)
    firstLines.set(base + openPath, text.split('\n')[0].trim())
  }
  // A file that cannot be read gets no first line and is tried again on the next poll; the compliance matrix says so.
  await Promise.allSettled(files.filter((f) => !firstLines.has(base + f)).map(async (f) => {
    firstLines.set(base + f, (await fetchText(base + f)).split('\n')[0].trim())
  }))

  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : esc(f)
    const t = tone(firstLines.get(base + f) || '')
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}">
      <span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">The spec-writer hasn’t written anything yet.</p>' : markdown(text)
  }
  await refreshMatrix(base, files, openPath === 'decision.md' ? text : null)
}

async function openDrawer(id) {
  openJobId = id
  openPath = null
  openText = undefined
  document.body.classList.add('open')
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  openJobId = null
  document.body.classList.remove('open')
}

document.addEventListener('click', (e) => {
  const approveEl = e.target.closest('[data-approve]')
  if (approveEl) return copyApprove(approveEl)
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  // Only when the card or graph lane itself has focus; Enter on the Approve button inside a card is that button's own click.
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-job], .g-job[data-job]')) {
    e.preventDefault() // Space would otherwise scroll the page
    openDrawer(e.target.dataset.job)
  }
})

// ---- Compliance matrix ----------------------------------------------------

// The one list of compliance gates, in display order; the drawer's matrix and the executive briefing both read it.
// kind says where a row's status comes from: review:<key> is that reviewer's verdict (keys as in REVIEWERS), decision
// and escalation come from decision.md, and placeholder is a check the factory has not built: always "not run".
const COMPLIANCE_ROWS = [
  { group: 'Security and Static Analysis', rows: [
    { id: 'sast', gate: 'SAST scan', check: 'Code scanned for security flaws', kind: 'placeholder' },
    { id: 'dast', gate: 'DAST scan', check: 'Running app probed for flaws', kind: 'placeholder' },
    { id: 'dependencies', gate: 'Dependency vulnerability check', check: 'Known flaws in dependencies', kind: 'placeholder' },
    { id: 'credentials', gate: 'Credential leak prevention (Vault integration status)',
      check: 'Secrets kept out of code, in Vault', kind: 'placeholder' },
    { id: 'security-review', gate: 'Security review', check: 'Verdict in review-security.md', kind: 'review:security' },
  ] },
  { group: 'IP and Licensing Guardrails', rows: [
    { id: 'license', gate: 'License compatibility', check: 'Dependency licenses allow this use', kind: 'placeholder' },
    { id: 'copyleft', gate: 'No copyleft (GPL) contamination', check: 'No copyleft-licensed code', kind: 'placeholder' },
  ] },
  { group: 'Regulatory and Policy Alignment', rows: [
    { id: 'iso27001', gate: 'ISO 27001', check: 'Information security controls', kind: 'placeholder' },
    { id: 'soc2', gate: 'SOC 2', check: 'Trust services criteria', kind: 'placeholder' },
    { id: 'fedramp', gate: 'FedRAMP tags', check: 'US federal cloud control tags', kind: 'placeholder' },
  ] },
  { group: 'Factory reviews and decision', rows: [
    { id: 'ux-review', gate: 'UX review', check: 'Verdict in review-ux.md', kind: 'review:ux' },
    { id: 'ui-review', gate: 'UI review', check: 'Verdict in review-ui.md', kind: 'review:ui' },
    { id: 'code-review', gate: 'Code review', check: 'Verdict in review-code.md', kind: 'review:code' },
    { id: 'decision', gate: 'Approver decision', check: 'Line 1 of decision.md', kind: 'decision' },
    { id: 'escalation', gate: 'Escalation reason', check: 'Why section of decision.md', kind: 'escalation' },
  ] },
]
const WHY_CHARS = 300

// The first paragraph under "## Why" in a decision.md, on one line; null when there is none.
function whyOf(text) {
  const lines = text.replace(/\r/g, '').split('\n')
  const at = lines.findIndex((l) => /^##\s+Why\s*$/.test(l))
  const para = []
  for (const l of at < 0 ? [] : lines.slice(at + 1)) {
    if (!l.trim()) {
      if (para.length) break
      continue
    }
    if (l.startsWith('#')) break
    para.push(l.trim())
  }
  return para.length ? para.join(' ') : null
}

// One job's matrix as rows { id, group, gate, check, status, evidence }, in COMPLIANCE_ROWS order. files are the
// paths listFiles(base) gives, firstLines the drawer's cache (keyed base + path; a listed file with no entry could not
// be read), and decision the text of decision.md when its line 1 is ESCALATE, or null. Status is only ever passed,
// failed or not run. It touches no DOM and fetches nothing, so the executive briefing can reuse it.
function complianceRows(base, files, firstLines, decision) {
  const line = (f) => firstLines.get(base + f)
  const reviews = files
    .map((f) => f.match(/^round-(\d+)\/review-(\w+)\.md$/))
    .filter((m) => m && REVIEWERS.some(([k]) => k === m[2]))
    .map(([f, n, key]) => ({ f, n: Number(n), key }))
    .sort((a, b) => a.n - b.n)
  // The latest round is the highest with any review file; a reviewer with no file in it has not run yet.
  const latest = Math.max(0, ...reviews.map((r) => r.n))
  const verdict = (f) => {
    if (line(f) === undefined) return ['not run', `could not read ${f}`]
    const v = verdictOf(line(f))
    return v === 'PASS' ? ['passed'] : v === 'CHANGES' ? ['failed'] : ['not run', 'verdict line not valid']
  }
  // Status of the latest round, then every round this reviewer has a file for, oldest first: "R1 failed, R2 passed".
  const review = (key) => {
    const mine = reviews.filter((r) => r.key === key)
    const now = mine.find((r) => r.n === latest)
    const [status, note] = now ? verdict(now.f) : ['not run', 'no verdict yet']
    const shown = latest ? `round ${latest}${note ? `: ${note}` : ''}` : note
    const history = mine.map((r) => `R${r.n} ${verdict(r.f)[0]}`).join(', ')
    return [status, history ? `${shown} · ${history}` : shown]
  }
  // null: there is no decision.md; undefined: it is listed but could not be read.
  const first = files.includes('decision.md') ? line('decision.md') : null
  const decided = () => {
    if (first === null) return ['not run', 'no decision yet']
    if (first === undefined) return ['not run', 'could not read decision.md']
    if (first === 'APPROVE') return ['passed', 'decision.md line 1: APPROVE']
    if (first === 'ESCALATE') return ['failed', 'decision.md line 1: ESCALATE, sent to a human']
    return ['not run', 'decision line not valid']
  }
  const escalation = () => {
    if (first === 'APPROVE') return ['not run', 'no escalation']
    if (first !== 'ESCALATE') return decided()
    if (decision === null) return ['not run', 'could not read decision.md']
    const why = whyOf(decision)
    if (why === null) return ['failed', 'no Why section in decision.md']
    return ['failed', why.length > WHY_CHARS ? `${why.slice(0, WHY_CHARS).replace(/\s+\S*$/, '')}…` : why]
  }
  const statusOf = (kind) => {
    if (kind === 'placeholder') return ['not run', 'check not built in the factory']
    if (kind === 'decision') return decided()
    if (kind === 'escalation') return escalation()
    return review(kind.replace(/^review:/, ''))
  }
  return COMPLIANCE_ROWS.flatMap(({ group, rows }) => rows.map(({ id, gate, check, kind }) => {
    const [status, evidence] = statusOf(kind)
    return { id, group, gate, check, status, evidence }
  }))
}

// The drawer's table, built from complianceRows() alone: one body per group, headed by the group's name.
function complianceTable(rows) {
  const groups = [...new Set(rows.map((r) => r.group))]
  const body = groups.map((g) => `<tbody><tr><th colspan="4" scope="rowgroup">${esc(g)}</th></tr>` +
    rows.filter((r) => r.group === g).map((r) => `<tr class="${esc(r.status.replace(' ', '-'))}">` +
      `<td>${esc(r.gate)}</td><td>${esc(r.check)}</td><td class="st">${esc(r.status)}</td><td>${esc(r.evidence)}</td></tr>`)
      .join('') + '</tbody>').join('')
  return '<div class="m-title" id="d-matrix-title">Compliance matrix</div>' +
    '<table id="d-matrix" aria-labelledby="d-matrix-title"><thead><tr>' +
    `<th>Gate</th><th>Check</th><th>Status</th><th>Evidence</th></tr></thead>${body}</table>`
}

let matrixHtml = null

// Runs at the end of every refreshDrawer(). Only an ESCALATE decision needs decision.md's text, for its Why: the open
// file's text when decision.md is open, else one fetch, which leaves it null when it fails ("could not read").
// The table is replaced only when it changed, so its scroll position survives the poll.
async function refreshMatrix(base, files, openDecision) {
  let decision = null
  if (files.includes('decision.md') && firstLines.get(base + 'decision.md') === 'ESCALATE') {
    decision = openDecision !== null ? openDecision : await fetchText(base + 'decision.md').catch(() => null)
  }
  const html = complianceTable(complianceRows(base, files, firstLines, decision))
  if (html !== matrixHtml) {
    matrixHtml = html
    $('d-compliance').innerHTML = html
  }
}

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n')
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) { html += `<div class="verdict ${t}">${esc(first)}</div>`; i = 1 }

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${inline(body.join(' '))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}
