name: Guardrails

# Architectural guardrails for the workload-identity model: what must never
# come back, what static analysis must keep finding nothing, and that Vault's
# configuration as code applies cleanly and converges.
#   tripwire   retired credential paths and plaintext Vault access
#              (.ci/check_no_legacy_vault_vars.sh; self-tested first)
#   semgrep    SAST: Python, secrets and Java registry rulesets plus this
#              project's invariants (.semgrep/sentinel.yml), blocking
#   terraform  instraclustr/terraform against a throwaway Vault and PKI: the
#              ceremony image builds, providers install offline from the
#              committed lock, fmt/validate pass, apply succeeds, and a second
#              plan is empty (no perpetual diff). Drift against the REAL Vault
#              is `vault-ceremony plan` on the host -- CI cannot and must not
#              reach it.
#   spire      a real spire-server on the committed config under a throwaway
#              root: the registration drift engine applies spire-entries.yaml,
#              converges, and catches a changed SVID lifetime
# Not yet here: a Joern CPG scan of the Java JMS edge (deferred).

on:
  push:
    paths:
      - 'nas-feedops-sentinel/**'
      - 'instraclustr/**'
      - 'scripts/**'
      - '.ci/**'
      - '.semgrep/**'
      - '.github/workflows/guardrails.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tripwire:
    name: Legacy credential tripwire
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every rule fires on a legacy-style fixture
        run: sh .ci/check_no_legacy_vault_vars.sh --self-test
      - name: Tracked files are clean
        run: sh .ci/check_no_legacy_vault_vars.sh

  semgrep:
    name: Semgrep (SAST, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: semgrep scan
        # Pinned by digest (1.140.0). Any finding fails the job; an accepted
        # exception is a `# nosemgrep: <rule>` with the reason on the same line.
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            semgrep/semgrep@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6 \
            semgrep scan --metrics=off --error \
              --config p/python --config p/secrets --config p/java --config .semgrep/ \
              nas-feedops-sentinel/src nas-feedops-sentinel/dashboard nas-feedops-sentinel/scripts \
              nas-feedops-sentinel/jumpstart/src instraclustr/scripts scripts

  spire:
    name: SPIRE registrations apply and converge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real spire-server on the committed server.conf, under a throwaway root
    # (which also proves SPIRE accepts the name-constrained upstream CA): the
    # drift engine must see an empty server as drift, apply the manifest, then
    # find no drift -- and must catch a changed SVID lifetime, the change the
    # rotation probe makes for a few minutes.
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway PKI (the real root never leaves its USB)
        run: |
          export PKI_ROOT_PASS=env:CI_ROOT_PASS CI_ROOT_PASS="ci-$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          sh instraclustr/scripts/pki.sh root-init "$RUNNER_TEMP/usb"
          sh instraclustr/scripts/pki.sh request "$RUNNER_TEMP/certs"
          sh instraclustr/scripts/pki.sh sign "$RUNNER_TEMP/usb" "$RUNNER_TEMP/certs"
          sh instraclustr/scripts/pki.sh install "$RUNNER_TEMP/certs"
      - name: spire-server on the committed configuration
        run: |
          docker run -d --name ci-spire \
            -v "$PWD/instraclustr/spire/server.conf:/opt/spire/conf/server/server.conf:ro" \
            -v "$RUNNER_TEMP/certs/spire:/opt/spire/conf/upstream/spire:ro" \
            -v "$RUNNER_TEMP/certs/trust:/opt/spire/conf/upstream/trust:ro" \
            ghcr.io/spiffe/spire-server@sha256:59a0b92b39773515e25e68a46c40d3b931b9c1860bc445a79ceb45a805cab8b4 \
            -config /opt/spire/conf/server/server.conf
          for i in $(seq 1 30); do
            docker exec ci-spire /opt/spire/bin/spire-server healthcheck \
              -socketPath /tmp/spire-server/private/api.sock >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs ci-spire; exit 1
      - name: Empty server is drift; apply; then no drift; a changed lifetime is drift again
        working-directory: instraclustr
        run: |
          python3 -m pip install --quiet pyyaml
          apply() { python3 scripts/spire-entries-apply.py spire-entries.yaml --exec-prefix "docker exec -i ci-spire" "$@"; }
          status=0; apply --check || status=$?
          [ "$status" -eq 1 ] || { echo "expected drift (exit 1) on an empty server, got $status"; exit 1; }
          apply --yes
          apply --check
          id=$(docker exec ci-spire /opt/spire/bin/spire-server entry show -socketPath /tmp/spire-server/private/api.sock \
                 -spiffeID spiffe://sentinelfaa.internal/workload/api -output json | tr -d '\n ' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          docker exec ci-spire /opt/spire/bin/spire-server entry update -socketPath /tmp/spire-server/private/api.sock \
            -entryID "$id" -parentID spiffe://sentinelfaa.internal/agent/nas-host \
            -spiffeID spiffe://sentinelfaa.internal/workload/api \
            -selector docker:label:com.sentinelfaa.identity:api -dns api.sentinelfaa.invalid -x509SVIDTTL 90
          status=0; apply --check || status=$?
          [ "$status" -eq 1 ] || { echo "a changed SVID lifetime was not reported as drift (exit $status)"; exit 1; }
          echo "drift engine: empty -> applied -> converged; changed lifetime caught"

  terraform:
    name: Vault as code applies and converges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway PKI (the real root never leaves its USB)
        run: |
          export PKI_ROOT_PASS=env:CI_ROOT_PASS CI_ROOT_PASS="ci-$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          sh instraclustr/scripts/pki.sh root-init "$RUNNER_TEMP/usb"
          sh instraclustr/scripts/pki.sh request "$RUNNER_TEMP/certs"
          sh instraclustr/scripts/pki.sh sign "$RUNNER_TEMP/usb" "$RUNNER_TEMP/certs"
      - name: Throwaway Vault (dev mode, loopback only)
        run: |
          docker run -d --name ci-vault -p 127.0.0.1:8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=ci-only-not-a-secret \
            hashicorp/vault@sha256:6b4e5dadf082cb3587930ced09b52851c5ae9f8d1c7df31ed39f0085a3029f63
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null && break; sleep 1; done
      - name: Build the ceremony image (providers baked from the committed lock)
        run: docker build -t sentinelfaa-vault-ceremony:ci instraclustr/terraform
      - name: fmt, validate, apply, and a second plan that must be empty
        run: |
          cp -r instraclustr/terraform "$RUNNER_TEMP/tf"
          tf() {
            docker run --rm --network host \
              -v "$RUNNER_TEMP/tf:/terraform" -v "$PWD/instraclustr/vault-policies:/vault-policies:ro" \
              -v "$RUNNER_TEMP/certs/trust:/certs/trust:ro" \
              -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=ci-only-not-a-secret \
              -w /terraform --entrypoint terraform sentinelfaa-vault-ceremony:ci "$@"
          }
          tf fmt -check -recursive
          tf init -input=false
          tf validate
          tf apply -input=false -auto-approve
          tf plan -input=false -detailed-exitcode
