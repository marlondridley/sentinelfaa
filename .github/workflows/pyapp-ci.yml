name: Sentinel CI

# Every push touching the application or its infrastructure, and every PR
# whatever its base (main, dev, test, or a stacked branch):
#   test          build the test image once; lint, then the full suite
#                 (including scripts/e2e_proof.py) against a real Postgres;
#                 coverage of src/ and dashboard/, with a floor for src/
#   audit         pip-audit over the hash-locked runtime dependencies
#   compose       both compose files render with the example env files
#   alerting      promtool/amtool accept the rules and routes, and a real
#                 Alertmanager delivers a test alert to a stand-in for Slack
#   deploy-smoke  containers, not code: a fresh checkout brings Keycloak up
#                 over TLS, and an md5 database upgrades to SCRAM behind
#                 PgBouncer (.github/scripts/deploy-smoke.sh)
#   image-scan    Trivy over the shipped runtime image; a fixable HIGH or
#                 CRITICAL finding fails the build
# Every job has a timeout: a hung test or container must not hold a runner
# for GitHub's six-hour default.

on:
  push:
    paths:
      - 'nas-feedops-sentinel/**'
      - 'instraclustr/**'
      - '.github/workflows/pyapp-ci.yml'
      - '.github/scripts/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (test image, Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          # The suite TRUNCATEs every table; it refuses any database whose
          # name is not marked disposable ("ci" is).
          POSTGRES_DB: sentinel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_ci -d sentinel_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: nas-feedops-sentinel
          file: nas-feedops-sentinel/docker/Dockerfile
          target: test
          tags: nas-feedops-sentinel:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint (ruff, rules in ruff.toml)
        working-directory: nas-feedops-sentinel
        run: docker run --rm -v "$PWD:/w:ro" -w /w nas-feedops-sentinel:test ruff check --no-cache src tests scripts dashboard

      - name: Test suite and end-to-end proof
        # Coverage counts lines and branches, for src/ and dashboard/ (the
        # dashboard is reported, not gated). The floor is src/'s coverage when
        # it was set: raise it as tests are added; never lower it to pass.
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=sentinel_ci -e POSTGRES_PASSWORD=ci-only-not-a-secret \
            -e POSTGRES_DB=sentinel_ci -e DATABASE_URL= \
            -e VAULT_AGENT_ENV_FILE= -e CRITIC_ENABLED=0 \
            -e COVERAGE_FILE=/tmp/.coverage \
            nas-feedops-sentinel:test sh -c '
              python -m pytest -p no:cacheprovider -q \
                --cov=src --cov=dashboard --cov-branch --cov-report=term-missing:skip-covered &&
              echo "src/ coverage (floor 84%):" &&
              coverage report --include="src/*" --fail-under=84 --format=total'

      - name: Infrastructure tests (PKI ceremony, identity wiring, SPIRE drift engine)
        # instraclustr/tests, in the same image (pytest, cryptography, OpenSSL 3):
        # the offline-root ceremony run for real with a throwaway root, real TLS
        # handshakes against its name constraints, the SPIRE registration drift
        # engine, and the wiring SPIRE, Terraform, compose and the Dockerfile
        # must agree on. Read-only checkout: the tests write only to tmp.
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo/instraclustr nas-feedops-sentinel:test \
            python -m pytest -p no:cacheprovider -q -o addopts= tests

  audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Accepted exceptions must be listed in nas-feedops-sentinel/cve-allowlist.md
      # and passed here as --ignore-vuln in the same PR. There are none.
      - name: pip-audit (runtime lock)
        working-directory: nas-feedops-sentinel
        run: |
          pip install pip-audit
          python -m pip_audit -r requirements.lock

  compose:
    name: Compose files render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          docker network create nas-network
          docker compose -f instraclustr/docker-compose.yml --env-file instraclustr/.env.example config -q
          docker compose -f nas-feedops-sentinel/docker-compose.yml --env-file nas-feedops-sentinel/.env.example config -q

  alerting:
    name: Alerting path (promtool, amtool, delivery)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The rules and routes are files only a real Prometheus and Alertmanager can judge. The script reads the
    # pinned images and the start-up command from docker-compose.yml, checks both configs with promtool and
    # amtool, routes sample alerts, and sends a critical one and the heartbeat through a real Alertmanager to
    # a stand-in for Slack: the critical one must arrive, the heartbeat must not.
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python3 .github/scripts/check_alerting.py

  deploy-smoke:
    name: Deployment smoke (fresh checkout; md5 to SCRAM upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rendering the compose files (above) cannot catch how containers are
    # created and wired. Both failures this runs were invisible to the test
    # suite: file mounts Docker turned into directories on a fresh checkout,
    # and PgBouncer on SCRAM in front of an md5 database. See the script.
    steps:
      - uses: actions/checkout@v4
      - name: Fresh checkout starts Keycloak over TLS; md5 database upgrades to SCRAM
        run: bash .github/scripts/deploy-smoke.sh

  image-scan:
    name: Runtime image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking. A HIGH or CRITICAL finding with a published fix fails the
    # build: rebuild on the patched base image, or bump the locked package.
    # Findings with no fix released (today: Debian OS packages in
    # python:3.12-slim) are not actionable here and are ignored. An accepted
    # exception goes in nas-feedops-sentinel/cve-allowlist.md and a
    # .trivyignore passed as `trivyignores`, in the same PR.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: nas-feedops-sentinel
          file: nas-feedops-sentinel/docker/Dockerfile
          tags: nas-feedops-sentinel:ci
          load: true
          cache-from: type=gha
      - name: Trivy
        # Pinned to a commit, not a tag: tags can move or disappear. The
        # unprefixed 0.28.0 tag was removed upstream (tags are v-prefixed
        # now), and this job then failed at setup on every run, unnoticed
        # behind continue-on-error.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nas-feedops-sentinel:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
