name: Secrets

# gitleaks over the whole history of every push and pull request. A secret committed and then deleted is still
# in the history, and still valid until it is rotated, so the history is what is scanned, not the tip.
#   self-test   a planted token is found (a scanner that finds nothing is indistinguishable from a broken one)
#   gitleaks    the repository, with .gitleaks.toml (the default ruleset) and .gitleaksignore (findings that were
#               read and are not secrets, one line each, with the reason)
# The image is pinned by digest, not by tag: tags can move.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/gitleaks/gitleaks v8.30.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test, a planted token is found
        run: |
          set -eu
          d="$(mktemp -d)"
          # Built here, not written in this file: a literal would be a finding in this repository's own history.
          printf 'github_token = "%s%s"\n' 'ghp_' 'aB3dE5fG7hJ9kL1mN3pQ5rS7tU9vW1xY3zA5' > "$d/planted.txt"
          if docker run --rm -v "$d:/scan:ro" "$GITLEAKS_IMAGE" detect --no-git --source /scan --no-banner --redact >/dev/null 2>&1; then
            echo "::error::gitleaks found nothing in a file with a planted token: the scan is not working"
            exit 1
          fi
          echo "planted token found, as it must be"

      - name: Scan the history
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" detect --source /repo --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner
