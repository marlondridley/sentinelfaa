services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: postgres
      DB_NAME: app_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    # Note: pgbouncer proxies over the network (DB_HOST: postgres) and never
    # touches Postgres's on-disk files directly, so this mount is inert —
    # harmless, but not doing anything. Safe to remove if you want to trim it.
    volumes:
      - pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    platform: linux/amd64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

  vault:
    image: hashicorp/vault:1.15.2
    container_name: vault
    hostname: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    platform: linux/amd64
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_TOOLS_LOG4J_LOGLEVEL: "ERROR"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
      KAFKA_PRODUCER_MAX_REQUEST_SIZE: 5048576
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 5048576
      KAFKA_CONSUMER_FETCH_MESSAGE_BYTES: 5048576
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: "1024M"
      HEAP_NEWSIZE: "256M"
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          memory: 1024M
    volumes:
      - "./cassandra-init.sh:/cassandra-init.sh"
    command: "sh /cassandra-init.sh"

  elasticsearch:
    image: nshou/elasticsearch-kibana
    container_name: elasticsearch-kibana
    hostname: elasticsearch
    platform: linux/amd64
    ports:
      - "9200:9200"
      - "5601:5601"
    environment:
      ES_JAVA_OPTS: "-Xms1024m -Xmx1024m"
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          memory: 1024M

  connect:
    image: confluentinc/cp-kafka-connect:7.5.0
    container_name: connect
    hostname: connect
    platform: linux/amd64
    ports:
      - "8083:8083"
    depends_on:
      - zookeeper
      - kafka
      - vault
      - cassandra
      - elasticsearch
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1024m"
      CONNECT_BOOTSTRAP_SERVERS: "kafka:9092"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Switched Key Converter to StringConverter (remove missing Schema Registry requirement)
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PRODUCER_COMPRESSION_TYPE: "snappy"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components,/etc/kafka-connect/plugins"
      CONNECT_PRODUCER_MAX_REQUEST_SIZE: 5048576
      CONNECT_CONSUMER_MAX_PARTITION_FETCH_BYTES: 5048576
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root-dev-token"
    volumes:
      - ./plugins:/etc/kafka-connect/plugins
      - ./config:/config

  connect-ui:
    image: landoop/kafka-connect-ui:latest
    container_name: connect-ui
    hostname: connect-ui
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      CONNECT_URL: "http://connect:8083"
    depends_on:
      - connect

volumes:
  pgdata: