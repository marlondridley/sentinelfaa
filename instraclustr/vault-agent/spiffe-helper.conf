# spiffe-helper sidecar (one per application service, nas-feedops-sentinel/
# docker-compose.yml): fetches this service's X.509-SVID from spire-agent's
# Workload API and keeps it current on a memory-only volume shared with the
# service's Vault Agent sidecar. The SVID lives one hour; spire-agent renews
# it at half-life and this rewrites the files, which Vault Agent reloads on
# its next authentication (vault-agent/*.hcl: reload = true).
agent_address = "/tmp/spire-agent/public/api.sock"
daemon_mode = true
cert_dir = "/run/spiffe"
# The leaf and its intermediates (SPIRE's CA, the SPIRE upstream CA): Vault's
# cert auth trusts only the root, so the client presents the chain.
svid_file_name = "svid.pem"
svid_key_file_name = "svid_key.pem"
svid_bundle_file_name = "bundle.pem"
# Owner-writable: spiffe-helper rewrites these files in place on every
# rotation, so a read-only mode fails the SECOND write ("permission denied")
# and the SVID then silently expires an hour later. The volume itself is
# memory-only, mode 0700, and mounted by this pair of containers alone.
cert_file_mode = 0644
key_file_mode = 0600
