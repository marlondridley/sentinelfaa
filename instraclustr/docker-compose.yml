  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth=md5"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: the app reaches it on nas-network; this is for local psql.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    # Pinned to the digest that was running as :latest, so a rebuild cannot
    # silently change the connection pooler under the application.
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    container_name: nas-pgbouncer
    environment:
      LISTEN_PORT: 6432
      LISTEN_ADDR: 0.0.0.0
      DB_USER: ${POSTGRES_USER:-sentinel_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-sentinel_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: md5
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-sentinel_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Real (non-dev) Vault server -- see vault-config.hcl for why. Starts
  # sealed and (on first ever boot) uninitialized; the vault-unseal service
  # below brings it to a usable state automatically. Healthcheck treats a
  # reachable-but-sealed API as "healthy" (exit code 2), since sealed is the
  # normal state right after a restart and vault-unseal depends on this
  # healthcheck to know when it can start talking to the API at all -- it
  # does not mean secrets are readable yet.
  vault:
    image: hashicorp/vault:1.15.2
    container_name: vault
    hostname: vault
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      # Mount target is /vault/file, matching vault-config.hcl's storage
      # path -- see that file's comment for why (the stock image's
      # entrypoint only auto-chowns /vault/config, /vault/logs, and
      # /vault/file to the non-root vault user; /vault/data would stay
      # root-owned and the vault process would fail to write Raft data).
      - vault-data:/vault/file
      - ./vault-config.hcl:/vault/config/vault-config.hcl:ro
    command: ["vault", "server", "-config=/vault/config/vault-config.hcl"]
    healthcheck:
      # `vault status` exits 0 (unsealed), 1 (error/unreachable), or 2
      # (reachable but sealed). Only 1 should count as unhealthy here --
      # sealed-but-reachable is the expected state after every restart until
      # vault-unseal runs, and vault-unseal itself needs the API to be
      # reachable (not "unsealed") before it can do anything.
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200; test $? -ne 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot-per-boot helper: initializes Vault on its very first ever run
  # (writing the root token + unseal key to ./vault-init-data/init.json, a
  # host-visible bind mount -- see .gitignore, this file must never be
  # committed), unseals it on every subsequent restart, and re-seeds the
  # app's secrets. See vault-unseal-and-seed.bash for the full logic.
  #
  # NOTE: after the very first run, the real root token lives only in
  # ./vault-init-data/init.json -- NOT in VAULT_TOKEN in .env. Both
  # instraclustr/.env AND ../nas-feedops-sentinel/.env still have the old
  # dev-mode placeholder (VAULT_TOKEN=myroottoken), which only worked
  # because -dev mode let you pick your own root token. Real Vault
  # generates a random one at first `vault operator init`, so EVERY
  # service that authenticates with VAULT_TOKEN from either .env file --
  # litellm here, plus dashboard/sentinel/api/temporal-worker in
  # nas-feedops-sentinel/docker-compose.yml -- needs that value updated to
  # the generated root token before it can read its secrets. Bring-up
  # order: (1) `docker compose up -d vault vault-unseal`, (2) read the
  # root token out of ./vault-init-data/init.json, (3) put it in both
  # .env files as VAULT_TOKEN, (4) THEN bring up everything else.
  vault-unseal:
    image: hashicorp/vault:1.15.2
    container_name: vault-unseal
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      APP_DB_USER: ${APP_DB_USER:-sentinel_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - ./vault-unseal-and-seed.bash:/scripts/vault-unseal-and-seed.bash:ro
      - ./vault-init-data:/vault-init-data
    entrypoint: ["/bin/sh", "/scripts/vault-unseal-and-seed.bash"]

  litellm:
    # Pinned: was main-latest, a moving nightly tag. This is the digest that ran.
    image: ghcr.io/berriai/litellm@sha256:690f24800e2208e4f31b01483b9d0521d79dc508c8191f1c0b2f21549400c580
    container_name: nas-litellm
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      vault-unseal:
        condition: service_completed_successfully
      litellm-db-init:
        condition: service_completed_successfully
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-}
      # Its own database, for virtual keys (litellm-db-init.sh). Direct to
      # Postgres: Prisma needs session-level connections, not the pooler.
      # No Vault token here any more -- the provider keys come from env, and
      # the proxy never needed root access to Vault.
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD is required}@postgres:5432/litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  # One-shot: LiteLLM's own database and login role (idempotent).
  litellm-db-init:
    image: postgres:16
    container_name: litellm-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD is required}
    volumes:
      - ./litellm-db-init.sh:/scripts/litellm-db-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/litellm-db-init.sh"]

  # One-shot: the application's scoped virtual key, stored in Vault
  # (litellm-bootstrap.sh). The application services read it with their
  # AppRole; the master key stays with the proxy.
  litellm-bootstrap:
    image: hashicorp/vault:1.15.2
    container_name: litellm-bootstrap
    depends_on:
      litellm:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "http://vault:8200"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LITELLM_APP_BUDGET_USD: ${LITELLM_APP_BUDGET_USD:-10}
      LITELLM_APP_RPM: ${LITELLM_APP_RPM:-30}
    volumes:
      - ./litellm-bootstrap.sh:/scripts/litellm-bootstrap.sh:ro
      - ./vault-init-data:/vault-init-data:ro
    entrypoint: ["/bin/sh", "/scripts/litellm-bootstrap.sh"]

volumes:
  # cassandra-data:      -- unused, see DISABLED block above
  # elasticsearch-data:  -- unused, see DISABLED block above
  postgres-data:
  vault-data:

networks:
  default:
    name: nas-network
    external: true