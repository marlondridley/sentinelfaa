#    ports:
#      - "5601:5601"
#    depends_on:
#      elasticsearch:
#        condition: service_healthy
#    environment:
#      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS}

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Fresh data directories only; postgres-scram migrates an existing one.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: the app reaches it on nas-network; this is for local psql.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    # Pinned to the digest that was running as :latest, so a rebuild cannot
    # silently change the connection pooler under the application.
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    container_name: nas-pgbouncer
    environment:
      LISTEN_PORT: 6432
      LISTEN_ADDR: 0.0.0.0
      DB_USER: ${POSTGRES_USER:-sentinel_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-sentinel_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      # Client and server logins both use SCRAM; auth_user looks up the other
      # roles' SCRAM secrets. Only valid once postgres-scram has re-hashed them.
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres-scram:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-sentinel_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Real (non-dev) Vault server -- see vault-config.hcl for why. Starts
  # sealed and (on first ever boot) uninitialized; the vault-unseal service
  # below brings it to a usable state automatically. Healthcheck treats a
  # reachable-but-sealed API as "healthy" (exit code 2), since sealed is the
  # normal state right after a restart and vault-unseal depends on this
  # healthcheck to know when it can start talking to the API at all -- it
  # does not mean secrets are readable yet.
  vault:
    image: hashicorp/vault:1.15.2
    container_name: vault
    hostname: vault
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      # TLS only (vault-config.hcl). The health check below talks to itself
      # over TLS too, verifying against the root like any other client.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: /vault/trust/root-ca.crt
    cap_add:
      - IPC_LOCK
    volumes:
      # Mount target is /vault/file, matching vault-config.hcl's storage
      # path -- see that file's comment for why (the stock image's
      # entrypoint only auto-chowns /vault/config, /vault/logs, and
      # /vault/file to the non-root vault user; /vault/data would stay
      # root-owned and the vault process would fail to write Raft data).
      - vault-data:/vault/file
      - ./vault-config.hcl:/vault/config/vault-config.hcl:ro
      # Its own certificate and key (instraclustr/certs/README.md), and the
      # public root for its health check. Directories, never single files:
      # Docker turns a missing file mount into an empty directory.
      - ./certs/vault:/vault/tls:ro
      - ./certs/trust:/vault/trust:ro
    command: ["vault", "server", "-config=/vault/config/vault-config.hcl"]
    # Vault's audit log goes to its stdout (terraform/main.tf, vault_audit):
    # bounded here, so it can never fill the disk and stop Vault.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      # `vault status` exits 0 (unsealed), 1 (error/unreachable), or 2
      # (reachable but sealed). Only 1 should count as unhealthy here --
      # sealed-but-reachable is the expected state after every restart until
      # vault-unseal runs, and vault-unseal itself needs the API to be
      # reachable (not "unsealed") before it can do anything.
      test: ["CMD-SHELL", "vault status; test $? -ne 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot, every boot: initializes Vault on its very first run, unseals it
  # on every restart (Shamir shares 1 and 2), and seeds the secrets this
  # project owns, as the vault-bootstrap AppRole -- no root token is stored
  # anywhere. See vault-unseal-and-seed.bash. Policy and auth-method changes
  # are Terraform's (instraclustr/terraform/), applied in a root ceremony.
  vault-unseal:
    image: hashicorp/vault:1.15.2
    container_name: vault-unseal
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "https://vault:8200"
      VAULT_CACERT: /certs-trust/root-ca.crt
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      APP_DB_USER: ${APP_DB_USER:-sentinel_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - ./vault-unseal-and-seed.bash:/scripts/vault-unseal-and-seed.bash:ro
      - ./vault-init-data:/vault-init-data
      # Unseal key share 2 lives only in this volume; share 1 is in
      # vault-init-data. Automatic unseal needs both (threshold 2 of 3).
      - vault-unseal-share:/vault-share-2
      # Share 3, written once for the operator to move off this machine.
      - ./vault-recovery:/vault-recovery
      - ./certs/trust:/certs-trust:ro
      - ./vault-policies:/vault-policies:ro
    entrypoint: ["/bin/sh", "/scripts/vault-unseal-and-seed.bash"]

  # The root ceremony (instraclustr/terraform/ceremony.sh), on demand only:
  #   docker compose --profile ceremony run --rm vault-ceremony plan|apply
  # A root token from unseal shares 1 and 2, one Terraform run, revoked.
  vault-ceremony:
    profiles: ["ceremony"]
    build: ./terraform
    image: sentinelfaa-vault-ceremony:local
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "https://vault:8200"
      VAULT_CACERT: /certs/trust/root-ca.crt
      CEREMONY_AUTO_APPROVE: ${CEREMONY_AUTO_APPROVE:-0}
    volumes:
      # main.tf's relative paths: ../vault-policies and ../certs/trust.
      - ./terraform:/terraform
      - ./vault-policies:/vault-policies:ro
      - ./certs/trust:/certs/trust:ro
      - ./vault-init-data/unseal:/vault-init-data/unseal:ro
      - vault-unseal-share:/vault-share-2:ro

  # SPIRE: workload identity for the application containers, replacing the
  # AppRole role_id/secret_id files this stack used to hand-rotate. A
  # container proves who it is by platform attestation (the Docker label its
  # compose service sets) and receives a short-lived X.509-SVID, which its
  # Vault Agent sidecar presents to Vault over mutual TLS -- see
  # spire-entries.yaml and vault-agent/ for the application side.
  #
  # spire-server's data_dir is a persistent volume: once initialized, it
  # keeps its own signing keys and registration entries across restarts,
  # same as Vault's own storage volume. Its CA is signed by the offline
  # root's SPIRE upstream CA (instraclustr/certs/README.md), mounted here
  # and nowhere else.
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.9.6
    container_name: spire-server
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-server-data:/opt/spire/data
      - ./certs/spire:/opt/spire/conf/upstream/spire:ro
      - ./certs/trust:/opt/spire/conf/upstream/trust:ro
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck",
             "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # spire-agent's data_dir also persists: SPIRE_JOIN_TOKEN is needed for this
  # agent's very first boot only. Once attested, a restart reuses the cached
  # node SVID and ignores the flag (an empty -joinToken means none) -- see
  # "SPIRE: first boot" in instraclustr/README.md. The image has no shell, so
  # compose passes the token straight to the binary.
  #
  # pid: host is required by the docker WorkloadAttestor (agent.conf): it
  # resolves a caller's PID to a container ID via /proc/<pid>/cgroup, which
  # is only visible across containers when sharing the host's PID
  # namespace -- there is no narrower way to grant just that on plain
  # Docker Compose (no Kubernetes here). This container can see every other
  # container's process list as a result; it does not gain the ability to
  # act on them (no ptrace/SYS_ADMIN granted), only to read /proc.
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.9.6
    container_name: spire-agent
    pid: host
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-agent-data:/opt/spire/data
      # The root it verifies spire-server against (agent.conf trust_bundle_path).
      - ./certs/trust:/opt/spire/conf/trust:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The socket every application container's spiffe-helper sidecar
      # reads from (nas-feedops-sentinel/docker-compose.yml) -- external,
      # like nas-network, so it's one real volume shared across both
      # compose projects rather than two separately project-scoped ones.
      - nas-spire-agent-socket:/tmp/spire-agent/public
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-joinToken", "${SPIRE_JOIN_TOKEN:-}"]

  litellm:
    # Pinned: was main-latest, a moving nightly tag. This is the digest that ran.
    image: ghcr.io/berriai/litellm@sha256:690f24800e2208e4f31b01483b9d0521d79dc508c8191f1c0b2f21549400c580
    container_name: nas-litellm
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      vault-unseal:
        condition: service_completed_successfully
      litellm-db-init:
        condition: service_completed_successfully
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-}
      # Its own database, for virtual keys (litellm-db-init.sh). Direct to
      # Postgres: Prisma needs session-level connections, not the pooler.
      # No Vault token here any more -- the provider keys come from env, and
      # the proxy never needed root access to Vault.
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD is required}@postgres:5432/litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  # One-shot, before PgBouncer: md5 -> SCRAM-SHA-256 for the shared server,
  # existing data directory included (postgres-scram.sh). Mounts the data
  # volume only to rewrite pg_hba.conf.
  postgres-scram:
    image: postgres:16
    container_name: postgres-scram
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:-sentinel_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-scram.sh:/scripts/postgres-scram.sh:ro
    entrypoint: ["/bin/sh", "/scripts/postgres-scram.sh"]

  # One-shot: LiteLLM's own database and login role (idempotent).
  litellm-db-init:
    image: postgres:16
    container_name: litellm-db-init
    depends_on:
      # After the switch, so the password it sets is hashed with SCRAM.
      postgres-scram:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD is required}
    volumes:
      - ./litellm-db-init.sh:/scripts/litellm-db-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/litellm-db-init.sh"]

  # One-shot: the application's scoped virtual key, stored in Vault
  # (litellm-bootstrap.sh). The application services receive it through their
  # Vault Agent sidecars; the master key stays with the proxy.
  litellm-bootstrap:
    image: hashicorp/vault:1.15.2
    container_name: litellm-bootstrap
    depends_on:
      litellm:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://vault:8200"
      VAULT_CACERT: /certs-trust/root-ca.crt
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LITELLM_APP_BUDGET_USD: ${LITELLM_APP_BUDGET_USD:-10}
      LITELLM_APP_RPM: ${LITELLM_APP_RPM:-30}
    volumes:
      - ./litellm-bootstrap.sh:/scripts/litellm-bootstrap.sh:ro
      - ./vault-init-data/bootstrap:/vault-bootstrap:ro
      - ./certs/trust:/certs-trust:ro
    entrypoint: ["/bin/sh", "/scripts/litellm-bootstrap.sh"]

volumes:
  # cassandra-data:      -- unused, see DISABLED block above
  # elasticsearch-data:  -- unused, see DISABLED block above
  postgres-data:
  vault-data:
  vault-unseal-share:
  spire-server-data:
  spire-agent-data:
  # External, like nas-network: one real volume, pre-created by
  # launch_nas_sentinel.ps1, shared with nas-feedops-sentinel/docker-compose.yml
  # rather than two separately project-scoped volumes of the same name.
  nas-spire-agent-socket:
    external: true

networks:
  default:
    name: nas-network
    external: true