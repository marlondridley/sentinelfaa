agent {
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    trust_domain = "sentinelfaa.internal"
    # The offline root (instraclustr/certs/): spire-server's own certificate
    # chains to it through the SPIRE upstream CA, so the agent verifies the
    # server from its very first boot -- no insecure_bootstrap, no
    # trust-on-first-use window for anything on nas-network to impersonate
    # spire-server in.
    trust_bundle_path = "/opt/spire/conf/trust/root-ca.crt"
    socket_path = "/tmp/spire-agent/public/api.sock"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {
        }
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data"
        }
    }

    # Attests workloads via the Docker Engine API (the mounted socket) --
    # matches on the docker:label selectors in ../spire-entries.yaml, no
    # per-container secret involved at all. use_new_container_locator is
    # required on cgroup v2 hosts (Docker Desktop included): the legacy
    # locator silently returns zero Docker selectors instead of failing.
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
            use_new_container_locator = true
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
        }
    }
}
