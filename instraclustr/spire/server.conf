server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "sentinelfaa.internal"
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    # SPIRE's own CA: signed by the upstream CA below, rotated every week.
    # Vault trusts the root above both (instraclustr/terraform/), so this
    # rotation never needs a Vault change.
    ca_ttl = "168h"
    ca_key_type = "ec-p384"
    # X.509-SVIDs only: workloads authenticate to Vault over mutual TLS with
    # these (a private key that never leaves the workload), never with a
    # replayable bearer JWT-SVID.
    default_x509_svid_ttl = "1h"
    ca_subject {
        country = ["US"]
        organization = ["sentinelfaa"]
        common_name = "sentinelfaa SPIRE CA"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    # No k8s API, no cloud IMDS on this host -- join_token is the realistic
    # node attestor for a single, non-orchestrated Docker host. Used once per
    # agent's lifetime: spire-agent's data_dir is a persistent volume, so a
    # restart reuses its node SVID instead of re-attesting -- see "SPIRE:
    # first boot" in instraclustr/README.md.
    NodeAttestor "join_token" {
        plugin_data {
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }

    # The offline root's SPIRE branch (instraclustr/certs/README.md): a
    # name-constrained intermediate the root signs once a year. Everything
    # SPIRE issues inherits its constraints -- spiffe://sentinelfaa.internal
    # identities only, never a DNS name or IP address. bundle_file_path is
    # the root: what workloads, and Vault's cert auth, trust.
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/opt/spire/conf/upstream/spire/intermediate-ca.crt"
            key_file_path = "/opt/spire/conf/upstream/spire/intermediate-ca.key"
            bundle_file_path = "/opt/spire/conf/upstream/trust/root-ca.crt"
        }
    }
}
