# LiteLLM proxy: the only way the application reaches a model.
#
# The application only ever names the alias below (model_name), through the
# proxy's OpenAI-compatible route; src/config.proxy_model() refuses any direct
# provider route. Swapping the model happens here, not in app code.
#
# One provider, one model: Claude Haiku 4.5, direct from Anthropic. There is no
# fallback. When it is down or out of quota the Critic reports itself
# unavailable (and the circuit breaker, ModelCircuitOpen, says so) and every
# alert is still staged for a person: the AI layer is advisory by design.
# instraclustr/tests/test_model_provider.py holds this to Haiku only, so adding
# another provider is a reviewed change to that test as well as to this file.
#
# This is a TEST configuration, not an authorized boundary for FAA operational
# data -- before real feed data is sent, primary-model must move to an approved
# endpoint (Claude on Bedrock GovCloud / Vertex Assured Workloads, Azure OpenAI
# Government, or on-prem inference).
model_list:
  - model_name: primary-model
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"

router_settings:
  # One retry, in the gateway and nowhere else (the application client retries
  # only a request that never reached it). A failing deployment is benched for a
  # minute.
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 60
  timeout: 60

litellm_settings:
  request_timeout: 60
  drop_params: true
