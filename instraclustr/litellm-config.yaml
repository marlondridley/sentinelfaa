# LiteLLM proxy: the only way the application reaches a model.
#
# The application only ever names the aliases below (model_name), through
# the proxy's OpenAI-compatible route; src/config.proxy_model() refuses any
# direct provider route. Swapping providers happens here, not in app code.
#
# Current routing is a low-cost TEST configuration: DeepSeek primary, Gemini
# fallback. Neither is an authorized boundary for FAA operational data --
# before real feed data is sent, primary-model must move to an approved
# endpoint (Claude on Bedrock GovCloud / Vertex Assured Workloads, Azure
# OpenAI Government, or on-prem inference).
model_list:
  # Low-cost primary for testing. If DeepSeek rejects its key, LiteLLM
  # surfaces that as a 400 and does NOT fall back to gemini-backup (it treats
  # 400s as client errors), so a bad DEEPSEEK_API_KEY breaks primary-model
  # outright; the Gemini deployments below only cover provider outages,
  # timeouts and rate limits.
  - model_name: primary-model
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: "os.environ/DEEPSEEK_API_KEY"
      api_base: "https://api.deepseek.com"

  # gemini-2.5-flash is closed to new API keys (Google returns 404 and names
  # gemini-3.8-flash as the replacement), so the Gemini aliases point there.
  #
  # One deployment per free-tier key under the same alias: the router spreads
  # requests across them and, when one key returns 429 (the free tier allows
  # 20 requests/day/model per project), cools it down and uses the next.
  # Gemini 3.x reasons before it answers, and the reasoning spends the caller's
  # max_tokens (the Watch Officer asks for 900): the JSON stopped mid-string with
  # finish_reason=length. reasoning_effort: low, on every Gemini deployment below,
  # leaves room for the answer.
  - model_name: gemini-backup
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: "os.environ/GEMINI_API_KEY"
      reasoning_effort: low

  - model_name: gemini-backup
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: "os.environ/GEMINI_API_KEY_2"
      reasoning_effort: low

  # Third key (GEMINI_API_KEY_3 in .env): uncomment once it is set. An entry
  # with an empty key fails every call routed to it.
  # - model_name: gemini-backup
  #   litellm_params:
  #     model: gemini/gemini-3.8-flash
  #     api_key: "os.environ/GEMINI_API_KEY_3"

  # Claude, direct from Anthropic (a service-account key scoped to the
  # sentinelfaa workspace). Nothing routes here yet: to use it, set
  # ANTHROPIC_API_KEY in .env and point LLM_MODEL (or a per-agent model) at
  # "claude-model", or add it to router_settings.fallbacks. Like the other
  # providers here it is a TEST route, not an authorized boundary for FAA
  # operational data (see the note at the top).
  - model_name: claude-model
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      # Sonnet reasons by default, and that spends the caller's max_tokens (the
      # Critic asks for 1000): the reply can stop with finish_reason=length and
      # no content. "thinking: disabled" is ignored by this model; a low
      # reasoning effort leaves room for the answer.
      reasoning_effort: low

  # Haiku 4.5: the cheaper, faster Claude, under its own alias. A separate
  # model_name, not a second claude-model entry: entries under one alias are
  # load-balanced, which would send some calls to each model.
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: "os.environ/GEMINI_API_KEY"
      reasoning_effort: low

# Fallbacks belong here. They used to sit inside the primary-model entry,
# where the proxy does not read them, so a DeepSeek failure had no fallback.
router_settings:
  fallbacks:
    - primary-model: ["gemini-backup","claude-haiku", "claude-model"]
  # One retry: a second key gets a chance, without multiplying calls against
  # a quota that is already gone. A failing key is benched for a minute.
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 60
  timeout: 60

litellm_settings:
  request_timeout: 60
  drop_params: true
