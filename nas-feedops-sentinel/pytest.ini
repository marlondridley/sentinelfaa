[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# The storage/gate layer is asyncpg-based, so most meaningful tests are
# `async def`. Without asyncio_mode, pytest collects an async test, never
# awaits it, and reports it as a warning rather than a failure -- which is
# how tests/test_execution_gate.py's HITL-gate assertions came to be
# non-executing while still appearing in the suite. `auto` runs any
# `async def test_*` without needing a per-test marker.
asyncio_mode = auto
