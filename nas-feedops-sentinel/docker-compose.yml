  # 10. Public access (docs/public-access.md), opt-in: launch_nas_sentinel.ps1
  # -Public starts it. An outbound-only Cloudflare tunnel -- no port opened on
  # this machine or its router. Its only destinations are the edge's two
  # public listeners (8450 dashboard, 8451 sign-in pages), which publish no
  # host port and expose nothing else. Cloudflare's free WAF rules (country
  # allow-list, sign-in rate limit, Bot Fight Mode) sit in front; Cloudflare
  # Access can be added. The tunnel's routes live in the Cloudflare dashboard
  # (a token-managed tunnel).
  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: nas-cloudflared
    restart: unless-stopped
    # The image's entrypoint is `cloudflared --no-autoupdate`: pinned, never
    # replacing itself. Metrics on loopback, for the health check only.
    command: ["tunnel", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      # The tunnel's connector token (Cloudflare Zero Trust -> Tunnels), from
      # either env file; empty, and the tunnel refuses to start.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    volumes:
      # The local authority's public certificate only, so the tunnel verifies
      # the edge: each route's TLS settings are Origin Server Name `localhost`
      # and CA Pool /etc/cloudflared/trust/edge-ca.crt (docs/public-access.md).
      - ./tls/trust:/etc/cloudflared/trust:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # The FAA SWIM Jumpstart kit is not containerized; see docs/operations.md.

volumes:
  prometheus-data:
  grafana-data:
  temporal-postgres-data:
  keycloak-postgres-data:
  # Workload identity (SVID) and rendered secrets, per service: memory only.
  migrate-svid: *secret-tmpfs
  migrate-secrets: *secret-tmpfs
  proof-svid: *secret-tmpfs
  proof-secrets: *secret-tmpfs
  temporal-worker-svid: *secret-tmpfs
  temporal-worker-secrets: *secret-tmpfs
  api-svid: *secret-tmpfs
  api-secrets: *secret-tmpfs
  sentinel-svid: *secret-tmpfs
  sentinel-secrets: *secret-tmpfs
  dashboard-svid: *secret-tmpfs
  dashboard-secrets: *secret-tmpfs
  # spire-agent's Workload API socket, shared with ../instraclustr (external,
  # created by launch_nas_sentinel.ps1).
  nas-spire-agent-socket:
    external: true

networks:
  default:
    name: nas-network
    external: true
