# NAS FeedOps Sentinel -- application stack.
#
# Runs on the external nas-network created by launch_nas_sentinel.ps1,
# alongside the infrastructure stack in ../instraclustr (Postgres, PgBouncer,
# Vault, LiteLLM). The `edge` nginx proxy is the way in: HTTPS on
# 127.0.0.1:8443-8447 (docker/edge/nginx.conf). Service ports are not
# published, except Keycloak, which serves HTTPS itself on
# https://localhost:8081 (admin console) and https://keycloak:8443 (the
# dashboard's sign-in, server to server). Nothing in the stack speaks plain
# HTTP to the identity service.
#
# Secrets: no application container holds a credential, a Vault token, or a
# way to reach Vault. Each service has two sidecars (section 9 below):
#   <service>-spiffe       spiffe-helper, labelled com.sentinelfaa.identity=
#                          <service>: spire-agent attests it and issues this
#                          service's own X.509-SVID (spiffe://sentinelfaa.internal/
#                          workload/<service>; one hour, rotated)
#   <service>-vault-agent  Vault Agent: logs in to Vault over mutual TLS with
#                          that SVID (cert auth, ../instraclustr/terraform/) and
#                          renders what the service's policy allows into
#                          /vault/secrets/app-config.env
# They share memory-only volumes with the service; nothing lands on disk. The
# service reads that file (VAULT_AGENT_ENV_FILE, src/vault_config.py) and
# starts only once it exists. See ../instraclustr/README.md.
#
# Database identities:
#   migrate      -- one-shot, runs as the schema owner (Vault postgres/credentials):
#                   schema, migrations, the application role and its grants.
#   all others   -- the application role (Vault postgres/app): DML only, and
#                   SELECT/INSERT only on the audit log and investigations.
#
# Operational notes that used to live here as long comments are in
# docs/operations.md.

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: nas-feedops-sentinel:latest

# What the services built from that image run with: no Linux capabilities, no privilege escalation, a read-only
# root filesystem (they write to the volumes they mount and to /tmp), and ceilings several times what each
# uses (docker stats: 220-290 MiB, under 30 processes), so a runaway process cannot take the host with it.
# Each command was run this way against a throwaway Postgres before this was turned on: the pool and
# migrations, the API, the dashboard, the watcher, the worker.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=256m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 2g

# Settings every application process shares.
x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATA_DIR: /app/data
  SWIM_RAW_FOLDER: ${SWIM_RAW_FOLDER:-/app/data/raw}
  # The kit writes on the host; file events do not cross the bind mount.
  SWIM_WATCH_POLLING: ${SWIM_WATCH_POLLING:-true}
  # What is in scope (src/airports.py; docs/operations.md, "Scope"). Empty airports is the default: the
  # four Potomac TRACON airports.
  SUPPORTED_AIRPORTS: ${SUPPORTED_AIRPORTS:-}
  SUPPORTED_TRACON: ${SUPPORTED_TRACON:-PCT}
  # Database: the application role through PgBouncer. DATABASE_URL is empty
  # on purpose, so it is rebuilt from these settings rather than inherited
  # from .env with the owner's credentials in it.
  POSTGRES_HOST: nas-pgbouncer
  POSTGRES_PORT: "6432"
  POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
  DATABASE_URL: ""
  RUN_MIGRATIONS_ON_CONNECT: "false"
  # The database identity and LiteLLM key: rendered by this service's Vault
  # Agent sidecar (see the header). No password in this environment.
  VAULT_AGENT_ENV_FILE: /vault/secrets/app-config.env
  # Models: proxy aliases only (instraclustr/litellm-config.yaml).
  LLM_BASE_URL: ${LLM_BASE_URL:-http://nas-litellm:4000/v1}
  # Refuse to start if the gateway URL is this container's own loopback.
  REQUIRE_REMOTE_LLM_PROXY: "1"
  LLM_MODEL: ${LLM_MODEL:-primary-model}
  CRITIC_MODEL: ${CRITIC_MODEL:-primary-model}
  # Empty means LLM_MODEL. Only an alias the application's LiteLLM key may call
  # and policies/model-use.yaml allows (primary-model, gemini-backup): the
  # gateway, not the app, decides which provider serves it (fallbacks in
  # instraclustr/litellm-config.yaml).
  WATCH_OFFICER_MODEL: ${WATCH_OFFICER_MODEL:-}
  INVESTIGATION_MODEL: ${INVESTIGATION_MODEL:-}
  CRITIC_ENABLED: ${CRITIC_ENABLED:-1}
  MAX_CRITIC_PER_PASS: ${MAX_CRITIC_PER_PASS:-5}
  INVESTIGATIONS_ENABLED: ${INVESTIGATIONS_ENABLED:-1}
  MAX_LLM_INVESTIGATIONS_PER_PASS: ${MAX_LLM_INVESTIGATIONS_PER_PASS:-3}
  TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal:7233}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-nas-feedops-queue}
  # OpenTelemetry (src/telemetry.py): traces, metrics and AGT's audit log
  # records. The metrics are always on each service's /metrics; set
  # OTEL_EXPORTER_OTLP_ENDPOINT in .env to also send everything to an OTLP
  # collector (http/protobuf, e.g. http://otel-collector:4318). Empty: nothing
  # leaves the host.
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-nas-feedops-sentinel}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-after-migrate: &after-migrate
  migrate:
    condition: service_completed_successfully

# The two sidecars every service gets (see the header). Both run as the
# application image's own user (uid/gid 999, pinned in docker/Dockerfile), so
# the files they share with it are owner-only.
x-spiffe-helper: &spiffe-helper
  image: ghcr.io/spiffe/spiffe-helper:0.10.0@sha256:95f5000aa1e0aadbfde20d66f1ad25733034162825aa51cc922ac78365bb8ee8
  user: "999:999"
  restart: unless-stopped
  command: ["-config", "/etc/spiffe-helper/spiffe-helper.conf"]

x-vault-agent: &vault-agent
  image: hashicorp/vault:1.15.2@sha256:6b4e5dadf082cb3587930ced09b52851c5ae9f8d1c7df31ed39f0085a3029f63
  user: "999:999"
  restart: unless-stopped
  healthcheck:
    # Healthy once the service's secrets are rendered: the service waits for this.
    test: ["CMD-SHELL", "test -s /vault/secrets/app-config.env"]
    interval: 3s
    timeout: 3s
    start_period: 5s
    retries: 60

# A memory-only volume, readable by uid 999 alone.
x-secret-tmpfs: &secret-tmpfs
  driver: local
  driver_opts:
    type: tmpfs
    device: tmpfs
    o: "uid=999,gid=999,mode=0700"

services:
  # 0. Schema owner job: runs to completion before anything else starts.
  migrate:
    <<: [*app-image, *hardened]
    container_name: nas-migrate
    command: ["python", "-m", "src.storage.migrate"]
    restart: "no"
    environment:
      <<: *app-env
      # Direct to Postgres as the schema owner, not through the pooler. The
      # owner's identity and the application role's password come from
      # migrate-vault-agent (../instraclustr/vault-agent/migrate.hcl).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - migrate-secrets:/vault/secrets:ro
    depends_on:
      migrate-vault-agent:
        condition: service_healthy
    healthcheck:
      disable: true

  # End-to-end proof, on demand only:  docker compose --profile proof run --rm proof
  # Runs scripts/e2e_proof.py in the test image against the disposable
  # sentinel_test database (created if missing), with the live model.
  proof:
    profiles: ["proof"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    image: nas-feedops-sentinel:test
    command: ["python", "scripts/e2e_proof.py"]
    environment:
      <<: *app-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sentinel_test
      RUN_MIGRATIONS_ON_CONNECT: "true"
      MAX_CRITIC_PER_PASS: "1"
      MAX_LLM_INVESTIGATIONS_PER_PASS: "1"
    volumes:
      - proof-secrets:/vault/secrets:ro
    depends_on:
      proof-vault-agent:
        condition: service_healthy
    healthcheck:
      disable: true

  # 1. Temporal worker: runs ingest/pipeline workflows started through the API.
  temporal-worker:
    <<: [*app-image, *hardened]
    container_name: nas-temporal-worker
    command: ["python", "-m", "src.temporal_worker"]
    stop_grace_period: 30s
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./data:/app/data
      - temporal-worker-secrets:/vault/secrets:ro
    depends_on:
      <<: *after-migrate
      temporal-worker-vault-agent:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      # /health on the metrics port answers 503 once the worker's event loop
      # has not turned for 60 s (src/metrics.py), and the worker's watchdog
      # exits the process so `restart: unless-stopped` starts a fresh one.
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9108/health\").read()' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # 2. HTTP API (FastAPI): /health, /v1/ready, /v1/ingest.
  api:
    <<: [*app-image, *hardened]
    container_name: nas-api
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      <<: *app-env
      API_KEY: ${API_KEY:?API_KEY is required -- /v1/ingest refuses every call without one}
      API_KEYS: ${API_KEYS:-}
    volumes:
      - api-secrets:/vault/secrets:ro
    depends_on:
      <<: *after-migrate
      api-vault-agent:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Live SWIM folder watcher: the Jumpstart kit writes, this ingests.
  sentinel:
    <<: [*app-image, *hardened]
    container_name: nas-sentinel
    restart: unless-stopped
    command: ["python", "-m", "src.main", "--mode", "replay", "--watch"]
    environment: *app-env
    volumes:
      - ./data:/app/data
      - sentinel-secrets:/vault/secrets:ro
    depends_on:
      <<: *after-migrate
      sentinel-vault-agent:
        condition: service_healthy

  # 4. Operator dashboard (Streamlit).
  dashboard:
    <<: [*app-image, *hardened]
    container_name: nas-dashboard
    restart: unless-stopped
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.headless=true
    environment:
      <<: *app-env
      # Streamlit writes machine_id under $HOME; /app/.streamlit is mounted read-only.
      HOME: /tmp/streamlit-home
      GRAFANA_PUBLIC_URL: https://localhost:8445
      PROMETHEUS_PUBLIC_URL: https://localhost:8447
      # Fail closed: without a working .streamlit/secrets.toml the dashboard shows "Sign-in is not configured"
      # and nothing else, instead of a typed callsign anyone reaching the public address could use. Set to 0
      # only for a lab run with no Keycloak.
      REQUIRE_SIGN_IN: ${REQUIRE_SIGN_IN:-1}
    volumes:
      - ./data:/app/data
      - dashboard-secrets:/vault/secrets:ro
      # Keycloak client settings (secrets.toml) and theme; read-only, never baked in.
      - ./.streamlit:/app/.streamlit:ro
      # The authority's public certificate only (tls/trust/edge-ca.crt). A
      # directory, never a file: see src/devcert.py.
      - ./tls/trust:/run/tls:ro
    depends_on:
      <<: *after-migrate
      dashboard-vault-agent:
        condition: service_healthy
      api:
        condition: service_started
      edge-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8501/_stcore/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # 5. Monitoring.
  prometheus:
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: nas-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - api

  grafana:
    image: grafana/grafana@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    container_name: nas-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?GRAFANA_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Anonymous read-only viewing, loopback only (port below).
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/nas-sentinel.json
      - GF_SERVER_ROOT_URL=https://localhost:8445/
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # 6. Identity: Keycloak on its own Postgres. Realm (clients, roles, the
  # ID-token role mapper) is code in keycloak/; import is skip-if-exists, so
  # scripts/keycloak-rbac.sh brings an existing realm up to date.
  keycloak-postgres:
    image: postgres:16
    container_name: nas-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required -- run scripts/Setup-Keycloak.ps1}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: nas-keycloak
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
      edge-certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8443"   # admin console, HTTPS
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required -- run scripts/Setup-Keycloak.ps1}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Substituted into the realm file; must equal client_secret in .streamlit/secrets.toml.
      KC_DASHBOARD_CLIENT_SECRET: ${KEYCLOAK_DASHBOARD_CLIENT_SECRET:?KEYCLOAK_DASHBOARD_CLIENT_SECRET is required -- run scripts/Setup-Keycloak.ps1}
      # Browser-facing URLs: the host port by default; while public access is
      # on (docs/public-access.md) the public sign-in hostname, reached through
      # the tunnel and the edge's sign-in-only listener. KEYCLOAK_BROWSER_URL
      # is written to .env by scripts/Set-PublicAccess.ps1 (the launcher's
      # -Public), so every compose run agrees on it. Server-to-server calls
      # keep the host they used (https://keycloak:8443 from the dashboard).
      # The admin console is always loopback-only, never public.
      KC_HOSTNAME: ${KEYCLOAK_BROWSER_URL:-https://localhost:8081}
      KC_HOSTNAME_ADMIN: https://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # The edge (the only proxy in front of Keycloak) sets X-Forwarded-*, with
      # the visitor's address from Cloudflare, so login events name the visitor.
      KC_PROXY_HEADERS: xforwarded
      # HTTPS only, with a certificate for keycloak / localhost / 127.0.0.1
      # signed by the local authority (src/devcert.py). The management
      # interface (health, port 9000) inherits it.
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/keycloak.key
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-nas-sentinel.json:/opt/keycloak/data/import/realm-nas-sentinel.json:ro
      # Its own certificate and key, and the authority's public certificate
      # (for the health check and the admin scripts) -- never the authority's key.
      # A directory, never files: see src/devcert.py.
      - ./tls/keycloak:/opt/keycloak/conf/tls:ro
      - ./keycloak/TlsHealth.java:/opt/keycloak/healthcheck/TlsHealth.java:ro
    healthcheck:
      # The image has no curl or openssl; the JDK checks /health/ready over
      # TLS against the local authority (keycloak/TlsHealth.java).
      test: ["CMD", "java", "/opt/keycloak/healthcheck/TlsHealth.java",
             "https://127.0.0.1:9000/health/ready", "/opt/keycloak/conf/tls/edge-ca.crt"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10

  # 7. Temporal: orchestration for API-started workflows, on its own Postgres.
  temporal-postgresql:
    image: postgres:16
    container_name: nas-temporal-postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${TEMPORAL_DB_USER:-temporal_worker}
      - POSTGRES_PASSWORD=${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER:-temporal_worker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: nas-temporal
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_DB_USER:-temporal_worker}
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
      - POSTGRES_SEEDS=temporal-postgresql
    ports:
      # Loopback only. Temporal has no authentication configured: anyone who
      # can reach this port can start workflows, bypassing the API's auth.
      - "127.0.0.1:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: nas-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://localhost:8446
    # Reached only through the edge proxy (https://localhost:8446). It is
    # unauthenticated and can terminate workflows.

  # 8. Edge TLS termination, and the certificates for it and for Keycloak.
  edge-certs:
    <<: *app-image
    container_name: nas-edge-certs
    command: ["python", "-m", "src.devcert", "/tls"]
    restart: "no"
    user: "0"
    volumes:
      - ./tls:/tls
    healthcheck:
      disable: true

  edge:
    image: nginx:1.27-alpine
    container_name: nas-edge
    restart: unless-stopped
    depends_on:
      edge-certs:
        condition: service_completed_successfully
      dashboard:
        condition: service_started
      api:
        condition: service_started
    volumes:
      - ./docker/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/edge:/etc/nginx/tls:ro     # its own certificate and key only
      # The authority's public certificate: the public sign-in listener
      # verifies Keycloak's certificate with it.
      - ./tls/trust:/etc/nginx/trust:ro
      # The public story site (static files, listener 8452; docs/public-access.md).
      - ./site:/usr/share/nginx/site:ro
    ports:
      - "127.0.0.1:8443:8443"   # dashboard
      - "127.0.0.1:8444:8444"   # API (/health, /v1/*)
      - "127.0.0.1:8445:8445"   # Grafana
      - "127.0.0.1:8446:8446"   # Temporal UI
      - "127.0.0.1:8447:8447"   # Prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8444/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 9. Workload identity sidecars (see the header): a spiffe-helper and a
  # Vault Agent per service. The label is the service's identity
  # (../instraclustr/spire-entries.yaml); the Agent config is its class's
  # (app.hcl: the sentinel-app policy; migrate.hcl: sentinel-migrate).
  migrate-spiffe:
    <<: *spiffe-helper
    container_name: nas-migrate-spiffe
    labels:
      com.sentinelfaa.identity: migrate
    volumes:
      - nas-spire-agent-socket:/tmp/spire-agent/public:ro
      - ../instraclustr/vault-agent:/etc/spiffe-helper:ro
      - migrate-svid:/run/spiffe

  migrate-vault-agent:
    <<: *vault-agent
    container_name: nas-migrate-vault-agent
    entrypoint: ["vault", "agent", "-config=/vault/agent/migrate.hcl"]
    depends_on:
      - migrate-spiffe
    volumes:
      - ../instraclustr/vault-agent:/vault/agent:ro
      - ../instraclustr/certs/trust:/certs-trust:ro
      - migrate-svid:/run/spiffe:ro
      - migrate-secrets:/vault/secrets

  proof-spiffe:
    <<: *spiffe-helper
    profiles: ["proof"]
    container_name: nas-proof-spiffe
    labels:
      com.sentinelfaa.identity: proof
    volumes:
      - nas-spire-agent-socket:/tmp/spire-agent/public:ro
      - ../instraclustr/vault-agent:/etc/spiffe-helper:ro
      - proof-svid:/run/spiffe

  proof-vault-agent:
    <<: *vault-agent
    profiles: ["proof"]
    container_name: nas-proof-vault-agent
    entrypoint: ["vault", "agent", "-config=/vault/agent/migrate.hcl"]
    depends_on:
      - proof-spiffe
    volumes:
      - ../instraclustr/vault-agent:/vault/agent:ro
      - ../instraclustr/certs/trust:/certs-trust:ro
      - proof-svid:/run/spiffe:ro
      - proof-secrets:/vault/secrets

  temporal-worker-spiffe:
    <<: *spiffe-helper
    container_name: nas-temporal-worker-spiffe
    labels:
      com.sentinelfaa.identity: temporal-worker
    volumes:
      - nas-spire-agent-socket:/tmp/spire-agent/public:ro
      - ../instraclustr/vault-agent:/etc/spiffe-helper:ro
      - temporal-worker-svid:/run/spiffe

  temporal-worker-vault-agent:
    <<: *vault-agent
    container_name: nas-temporal-worker-vault-agent
