# Alert rules for NAS FeedOps Sentinel. Each rule names the failure it
# watches for; the annotations say what to check first.
groups:
  - name: nas-sentinel-integrity
    rules:
      - alert: CriticalAlertsUnstaged
        # The headline invariant. The reconciler repairs this every minute, so
        # a value that stays above zero means staging itself is failing.
        expr: max(nas_critical_alerts_unstaged{job="nas-sentinel"}) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} CRITICAL alert(s) have no staged action"
          description: "Check nas-sentinel logs for reconcile_failed / staging errors. docs/operations.md."

      - alert: HumanReviewQueueStale
        expr: max(nas_hitl_oldest_pending_age_seconds{job="nas-sentinel"}) > 3600
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "A staged action has waited over an hour for human review"
          description: "Oldest PENDING action is {{ $value | humanizeDuration }} old."

  - name: nas-sentinel-feeds
    rules:
      - alert: AirportFeedDegraded
        # 1=STALE 2=DEGRADED 3=UNAVAILABLE 4=DISCONNECTED (src/metrics.py)
        expr: max by (airport) (nas_airport_overall_status) >= 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Feed at {{ $labels.airport }} degraded or worse for 10 minutes"

      - alert: SwimBacklogNearJanitorAge
        # The janitor deletes by age (default 5 min), ingested or not: a message that waits longer than that
        # is gone. This fires while there is still time to act.
        expr: max(nas_swim_folder_oldest_waiting_seconds{job="nas-sentinel"}) > 180
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "SWIM messages have waited over 3 minutes to be ingested"
          description: "Messages older than the janitor's age are deleted unprocessed (nas_swim_files_dropped_unprocessed_total). Is the watcher running and keeping up? See nas_swim_folder_backlog_files."

      - alert: SwimFilesDroppedUnprocessed
        expr: increase(nas_swim_files_dropped_unprocessed_total{job="nas-sentinel"}[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "The Kit-folder janitor deleted messages that were never ingested"
          description: "The ingest fell behind the janitor's age. Raise the age, or fix the consumer; see docs/operations.md (The FAA SWIM Jumpstart kit)."

      - alert: NoEventsIngested
        expr: sum(increase(nas_events_ingested_total[30m])) == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "No SWIM events ingested in 30 minutes"
          description: "Is the Jumpstart kit running? Check data/raw/swim_live/log and data/failed/."

  - name: nas-sentinel-ai
    rules:
      - alert: LLMErrorRateHigh
        # Every AI path degrades to rules, which is safe but silent; this makes
        # "the model is down" visible (the state the stack ran in for weeks).
        expr: |
          sum(rate(nas_llm_calls_total{outcome=~"error|guardrail_rejected"}[15m]))
            / clamp_min(sum(rate(nas_llm_calls_total[15m])), 1e-9) > 0.5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Over half of model calls are failing; AI output is falling back to rules"
          description: "Check nas-litellm logs: provider keys, quota (429), model availability."

      - alert: ModelCircuitOpen
        # The gateway failed several calls in a row, so calls to this model are being refused
        # without being sent and the Critic reports itself unavailable (src/llm_guard.py). Alerts
        # are still staged for a person; only the advisory is missing. One probe call is let
        # through every LLM_BREAKER_COOLDOWN_SECONDS, so this clears by itself when the model is back.
        expr: max by (model) (nas_llm_circuit_state) >= 2
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Model circuit open for {{ $labels.model }}: AI advisories are unavailable"
          description: "Check nas-litellm logs: provider keys, quota (429), model availability. docs/runbooks.md."

      - alert: LLMPassBudgetExhausted
        # A pipeline pass spent LLM_TOKEN_BUDGET_PER_PASS and later Critic or investigation calls
        # in it were refused. A burst that big is worth knowing about; staging is unaffected.
        expr: increase(nas_llm_budget_refusals_total[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "A pipeline pass spent its model token budget; later calls in it fell back to rules"
          description: "Raise LLM_TOKEN_BUDGET_PER_PASS only if the burst is legitimate. Search the logs for llm_pass_budget_exhausted."

      # The rules below read the agent metrics the Agent Governance Toolkit
      # computes and OpenTelemetry exports (src/telemetry.py). They are the
      # same for every model provider behind the gateway.
      - alert: AgentBlockedFromDecidingOrWriting
        # An agent tried to reach the human gate from the other side: decide,
        # write or stage. The tool-use policy refused it; that it was tried at
        # all means a code path runs agent logic where it must not.
        expr: sum(increase(agent_policy_violations_total{agt_audit_action="tool_call", agent_policy_decision="block"}[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "An agent attempted a decide/write/stage tool call and was blocked"
          description: "Search the logs for tool_call_refused_by_policy (rule agents-never-decide-or-write). docs/runbooks.md."

      - alert: ModelCallsRefusedByPolicy
        # A refused model call sends nothing and the agent falls back to its
        # rules. In normal operation there are none: a refusal means an
        # unregistered role, an alias outside the gateway, an oversized prompt,
        # or a credential in a prompt (block).
        expr: sum by (agt_agent_id, agent_policy_name) (increase(agent_policy_violations_total{agt_audit_action="model_call"}[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Model calls by {{ $labels.agt_agent_id }} refused by rule {{ $labels.agent_policy_name }}"
          description: "policies/model-use.yaml decided. Search the logs for model_call_refused_by_policy. docs/runbooks.md."

      - alert: ModelCallErrorRateHigh
        expr: |
          sum(rate(gen_ai_client_operation_duration_seconds_count{error_type!=""}[15m]))
            / clamp_min(sum(rate(gen_ai_client_operation_duration_seconds_count[15m])), 1e-9) > 0.25
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Over a quarter of model calls end in an error class"
          description: "Break down by error_type and gen_ai_provider_name: timeout, rate_limited, quota_exhausted, auth_error, invalid_output."

      - alert: ModelCallLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(gen_ai_client_operation_duration_seconds_bucket[15m]))) > 30
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "p95 model call time over 30 s (the readiness objective)"
          description: "Check the provider behind the gateway (gen_ai_response_model) and LLM_TIMEOUT_SECONDS."

      - alert: AgentFallbackRateHigh
        # Agents that try a model and fall back to their rules: safe, but the
        # investigation is rules-only.
        expr: |
          sum(rate(agent_tasks_total{sentinel_outcome="fallback"}[30m]))
            / clamp_min(sum(rate(agent_tasks_total{sentinel_outcome!="deterministic"}[30m])), 1e-9) > 0.2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Over 20% of agent invocations are falling back to rules"
          description: "The Agent Evaluation page shows which agent and which outcome class."

  - name: nas-sentinel-platform
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is not answering Prometheus"

  # The alerting path watching itself. Everything above fails silently if these
  # do: a rule that fires into a broken Alertmanager or Slack pages nobody.
  - name: nas-sentinel-alerting
    rules:
      - alert: Watchdog
        # Fires all the time, on purpose. Alertmanager holds it (alertmanager.yml
        # routes it to a receiver that sends nothing). Present in Alertmanager's
        # UI = rules are reaching it; absent = they are not.
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "Alerting heartbeat: this always fires"
          description: "Held, never sent. If it is missing from Alertmanager (https://localhost:8448), rules are not reaching it."

      - alert: AlertNotificationsFailing
        # Slack did not accept what Alertmanager sent: a wrong, revoked or
        # missing webhook URL, or no route out. This one cannot reach Slack
        # either; it shows at https://localhost:8447/alerts and in Alertmanager.
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Alertmanager cannot deliver to {{ $labels.integration }}"
          description: "Check SLACK_WEBHOOK_URL and `docker logs nas-alertmanager`. docs/runbooks.md."

      - alert: AlertsNotReachingAlertmanager
        # Prometheus fired something and could not hand it over.
        expr: sum(increase(prometheus_notifications_errors_total[10m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Prometheus cannot send alerts to Alertmanager"
          description: "Is nas-alertmanager running? `docker ps`, `docker logs nas-prometheus`. docs/runbooks.md."
