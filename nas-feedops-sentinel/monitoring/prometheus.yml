global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: nas-feedops
    environment: local

rule_files:
  - /etc/prometheus/alert-rules.yml

# What fires is sent to Alertmanager (monitoring/alertmanager.yml), which groups
# it and posts it to Slack. Prometheus still shows it under Alerts
# (https://localhost:8447/alerts); Alertmanager's own page, with silences, is
# https://localhost:8448.
alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Live SWIM watcher + reconciler (src/main.py --watch).
  - job_name: nas-sentinel
    static_configs:
      - targets: ["sentinel:9108"]
        labels: {service: sentinel, tracon: PCT}

  # Temporal worker: runs API-started pipelines, so Critic, investigation and
  # HITL metrics for those runs live here.
  - job_name: nas-temporal-worker
    static_configs:
      - targets: ["temporal-worker:9108"]
        labels: {service: temporal-worker, tracon: PCT}

  # HTTP API process (internal /metrics; not routed by the edge proxy).
  - job_name: nas-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
        labels: {service: api, tracon: PCT}

  # Alertmanager: notification failures (AlertNotificationsFailing) and, through
  # ScrapeTargetDown, Alertmanager itself going away.
  - job_name: nas-alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: {service: alertmanager, tracon: PCT}

  # Streamlit dashboard (dashboard/lib/page_setup.py serves /metrics on 9108). Without this the dashboard could
  # be down and nothing here would say so.
  - job_name: nas-dashboard
    static_configs:
      - targets: ["dashboard:9108"]
        labels: {service: dashboard, tracon: PCT}

  # Temporal server's own metrics (PROMETHEUS_ENDPOINT in docker-compose.yml): task queue latency, workflow and
  # activity failures. The worker's metrics above say what ran; these say whether the server can run it.
  - job_name: nas-temporal
    static_configs:
      - targets: ["temporal:8000"]
        labels: {service: temporal, tracon: PCT}

  # The model gateway, in the infrastructure stack (../instraclustr/docker-compose.yml, container nas-litellm): the
  # application key's remaining and maximum budget, for LLMBudgetNearlyUsed. Its /metrics takes no key
  # (litellm-config.yaml, require_auth_for_metrics_endpoint), so none is here. /metrics redirects to /metrics/.
  - job_name: nas-litellm
    metrics_path: /metrics/
    static_configs:
      - targets: ["nas-litellm:4000"]
        labels: {service: litellm, tracon: PCT}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
