# Alertmanager for NAS FeedOps Sentinel. Prometheus evaluates monitoring/alert-rules.yml
# and sends what fires here; this groups it, removes repeats, and posts it to Slack.
#
# The Slack webhook URL is a secret and is not in this file. docker-compose.yml's
# `alertmanager` service writes SLACK_WEBHOOK_URL (from the .env files) to
# /tmp/slack_api_url, in memory, before it starts; `api_url_file` below reads it there.
# Without the variable the file is empty: alerts are still held and shown in the
# Alertmanager UI (https://localhost:8448), delivery fails visibly (the
# AlertNotificationsFailing rule), and nothing is sent anywhere.
#
# Checked in CI (.github/scripts/check-alerting.sh): amtool parses it and routes
# sample alerts, and a real Alertmanager delivers one to a stand-in for Slack.

global:
  resolve_timeout: 5m

# The two windows the briefs are let through in (alert-rules.yml, nas-sentinel-briefs). Eastern time, so the
# brief arrives at 07:00 and 19:00 in New York whatever the host's clock or the time of year.
time_intervals:
  - name: morning-brief-window
    time_intervals:
      - times:
          - start_time: "07:00"
            end_time: "07:10"
        location: America/New_York
  - name: evening-brief-window
    time_intervals:
      - times:
          - start_time: "19:00"
            end_time: "19:10"
        location: America/New_York

route:
  receiver: slack
  # One message per alert name, and per airport for the per-airport rule.
  group_by: [alertname, airport]
  group_wait: 30s        # collect what fires together before the first message
  group_interval: 5m     # how soon a group that gained or lost an alert is sent again
  repeat_interval: 4h    # reminder while it keeps firing
  routes:
    # Watchdog fires all the time on purpose (alert-rules.yml). It is held, not
    # sent: seeing it in the UI means rules are reaching Alertmanager.
    # Routes match in order, so this must stay above the catch-alls below.
    - matchers: [alertname="Watchdog"]
      receiver: "null"
    # The briefs fire all the time; each is sent only inside its window. The alert is already known to the
    # group, so the first message goes out within group_interval of the window opening, and repeat_interval
    # (shorter than the 12 hours between windows, longer than a window) keeps it to one message per window.
    - matchers: [alertname="MorningBrief"]
      receiver: slack-brief
      active_time_intervals: [morning-brief-window]
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 11h
    - matchers: [alertname="EveningBrief"]
      receiver: slack-brief
      active_time_intervals: [evening-brief-window]
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 11h
    # Critical: a shorter wait before the first message, and a reminder every hour.
    - matchers: [severity="critical"]
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: "null"
  - name: slack
    slack_configs:
      - api_url_file: /tmp/slack_api_url
        send_resolved: true
        color: '{{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}'
        title: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}CRITICAL{{ else }}WARNING{{ end }} ({{ .Alerts.Firing | len }} firing){{ else }}RESOLVED{{ end }}: {{ .GroupLabels.alertname }}{{ with .GroupLabels.airport }} at {{ . }}{{ end }}'
        text: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ with .Annotations.description }}{{ . }}
          {{ end }}{{ end }}Runbook: nas-feedops-sentinel/docs/runbooks.md, "{{ .GroupLabels.alertname }}"
  # The briefs: same webhook, a neutral colour, and no "resolved" message, since a brief never resolves.
  - name: slack-brief
    slack_configs:
      - api_url_file: /tmp/slack_api_url
        send_resolved: false
        color: '#439FE0'
        title: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: |-
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          Anything that needs a person arrives as its own alert.
