# Static types for the code a wrong value would harm most: the storage layer (every write to the evidence
# tables), the execution gate (what is staged, and the one place a decision is recorded) and authorization.
# Run in CI (.github/workflows/pyapp-ci.yml, job "test") and locally:  python -m mypy
#
# Scope is the three areas, not the whole tree: the rest is checked by the suite and ruff, and a type gate
# that fails on code nobody is touching teaches people to ignore it. Widen `files` as areas are cleaned up.
# follow_imports = silent keeps the imported code's types in play without reporting its errors here.
[mypy]
python_version = 3.12
files = src/storage, src/execution_gate.py, src/auth.py, src/keycloak_auth.py
follow_imports = silent
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = False
no_implicit_optional = True
