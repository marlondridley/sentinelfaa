# Edge TLS termination: the only published entry point to the stack.
#
# Browsers and API clients speak HTTPS to this proxy; it forwards to the
# services over plain HTTP on the internal nas-network, which nothing outside
# the host can reach. One HTTPS port per console, bound to 127.0.0.1 in
# docker-compose.yml. The certificate is for localhost, signed by the local
# authority (src/devcert.py, tls/edge/); trust tls/edge-ca.crt once in the OS
# store, or replace tls/edge/ with a certificate from your CA.
#
# Sign-in: "Sign in with Keycloak" sends the browser to Keycloak's login page
# (KC_HOSTNAME, docker-compose.yml) and back to the dashboard's
# /oauth2callback; the dashboard talks to Keycloak server-side over TLS
# (https://keycloak:8443). Locally the browser reaches Keycloak directly on
# https://localhost:8081, which is also the admin console (loopback only).
#
# Public access (docs/public-access.md) adds two listeners, 8450 and 8451, at
# the bottom of this file. Only the Cloudflare tunnel reaches them -- no host
# port maps to them -- and they decide which paths the internet can reach at
# all: the dashboard, and Keycloak's sign-in pages. Nothing else.

worker_processes 1;
events { worker_connections 256; }

http {
    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate     /etc/nginx/tls/edge.crt;
    ssl_certificate_key /etc/nginx/tls/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:1m;

    # No HSTS: the certificate is self-signed for localhost, and pinning
    # localhost to HTTPS in the browser would break every other local service.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    proxy_http_version 1.1;
    proxy_set_header Host              $host:$server_port;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: survive container recreation

    # Dashboard (Streamlit: needs websocket upgrade for /_stcore/stream)
    server {
        listen 8443 ssl;
        location / {
            set $upstream http://dashboard:8501;
            proxy_pass $upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # API: health, readiness and the versioned routes only.
    server {
        listen 8444 ssl;
        location = /health { set $upstream http://api:8000; proxy_pass $upstream; }
        location /v1/      { set $upstream http://api:8000; proxy_pass $upstream; }
        location /         { return 404; }   # /metrics, /docs: internal only
    }

    # Grafana
    server {
        listen 8445 ssl;
        location / {
            set $upstream http://grafana:3000;
            proxy_pass $upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # Temporal UI (unauthenticated; loopback-only publication is its control)
    server {
        listen 8446 ssl;
        location / { set $upstream http://temporal-ui:8080; proxy_pass $upstream; }
    }

    # Prometheus
    server {
        listen 8447 ssl;
        location / { set $upstream http://prometheus:9090; proxy_pass $upstream; }
    }

    # ── Public entry points: reached ONLY by the Cloudflare tunnel ───────────
    # nas-cloudflared (docker-compose.yml, profile "public") is their only
    # client; docker-compose.yml publishes no host port for them. Cloudflare's
    # WAF rules are in front (docs/public-access.md). These listeners are the
    # line that does not depend on any of that: whatever a tunnel rule says,
    # only these paths exist here.
    # HSTS here, unlike the loopback listeners: these answer only on the public
    # hostnames, which Cloudflare serves with a real certificate.
    # The client address is the one Cloudflare saw (CF-Connecting-IP), so
    # Keycloak's login events name the visitor, not the tunnel.

    # Public dashboard. Host WITHOUT a port: the browser's Origin is
    # https://<public host>, and Streamlit's websocket check compares the two.
    # (proxy_set_header in a location replaces the http-level set entirely,
    # so every header is set here.)
    server {
        listen 8450 ssl;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        location / {
            set $upstream http://dashboard:8501;
            proxy_pass $upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }

    # Public sign-in: Keycloak's login pages for the nas-sentinel realm and the
    # assets they load -- nothing else. The admin console, the master realm and
    # the account console answer 404 here, so they cannot be reached from the
    # internet even through a mistaken tunnel rule. TLS to Keycloak is verified
    # against the local authority, by name.
    server {
        listen 8451 ssl;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/nginx/trust/edge-ca.crt;
        proxy_ssl_name                keycloak;
        proxy_ssl_server_name         on;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;

        location /realms/nas-sentinel/         { set $upstream https://keycloak:8443; proxy_pass $upstream; }
        location /resources/                   { set $upstream https://keycloak:8443; proxy_pass $upstream; }
        location /realms/nas-sentinel/account  { return 404; }   # guests manage nothing there
        location /                             { return 404; }   # admin console, master realm, metrics
    }
}
